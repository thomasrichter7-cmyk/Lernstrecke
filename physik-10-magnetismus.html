      <div class="hint">Groß-/Kleinschreibung wird ignoriert. Mehrere Alternativen erlauben verschiedene Schreibweisen.</div>`;
  }
  if (t.type === 'password') {
    body = `<label class="fld">Hinweistext für Schüler (optional)</label>
      <input type="text" value="${attr(t.q)}" placeholder="z. B. Das Lösungswort wird im Video genannt." oninput="T().q=this.value">
      <label class="fld">Lösungswort</label>` +
      t.answers.map((a, i) => `<div class="row">
        <input type="text" value="${attr(a)}" placeholder="Lösungswort ${i + 1}" oninput="T().answers[${i}]=this.value">
        <button class="rm" onclick="rmAnswer(${i})">✕</button></div>`).join('') +
      `<button class="add-row" onclick="addAnswer()">+ Alternative Schreibweise</button>
      <div class="hint">Groß-/Kleinschreibung wird ignoriert. Ohne Hinweistext steht einfach „Gib das Lösungswort ein."</div>`;
  }
  if (t.type === 'dragdrop') {
    body = `<label class="fld">Begriff und passende Definition (auch als Bild möglich)</label>` +
      t.pairs.map((p, i) => `<div class="row pair-row" ondragover="onRowDragOver(event)" ondragleave="onRowDragLeave(event)" ondrop="onRowDrop(event, ${i})">
        ${pairSideEditor(p.term, 'term', i)}
        ${pairSideEditor(p.def, 'def', i)}
        <button class="rm" onclick="rmPair(${i})">✕</button></div>`).join('') +
      `<button class="add-row" onclick="addPair()">+ Paar</button>`;
  }
  if (t.type === 'gap') {
    body = `<label class="fld">Text mit Lücken</label>
      <textarea oninput="T().text=this.value">${esc(t.text)}</textarea>
      <div class="hint">Lückenwörter mit *Sternchen* markieren.</div>`;
  }
  if (t.type === 'order') {
    body = `<label class="fld">Richtige Reihenfolge eingeben</label>` +
      t.items.map((it, i) => `<div class="row">
        <input type="text" value="${attr(it)}" placeholder="Schritt ${i + 1}" oninput="T().items[${i}]=this.value">
        <button class="rm" onclick="rmItem(${i})">✕</button></div>`).join('') +
      `<button class="add-row" onclick="addItem()">+ Schritt</button>`;
  }
  body += `<div class="fb-editor-wrap">
      <label class="fld">Rückmeldung bei richtiger Antwort <span style="font-weight:400;color:var(--faint)">(optional — z. B. Zusatzwissen als kleine Belohnung)</span></label>
      <div class="fb-editor-hint">Erscheint direkt, wenn die Aufgabe richtig gelöst wurde. Text, Bilder und Links wie bei der Zusatzinfo einfügbar.</div>
      <div class="editor zi-editor fb-zi" contenteditable="true" data-ph="z. B. Wusstest du, dass …?"
           oninput="T().fbCorrect=this.innerHTML" onpaste="onPaste(event)"
           ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event)">${t.fbCorrect || ''}</div>
      <label class="fld">Rückmeldung bei falscher Antwort <span style="font-weight:400;color:var(--faint)">(optional — z. B. ein Tipp)</span></label>
      <div class="editor zi-editor fb-zi" contenteditable="true" data-ph="z. B. ein Tipp zur Lösung"
           oninput="T().fbWrong=this.innerHTML" onpaste="onPaste(event)"
           ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event)">${t.fbWrong || ''}</div>
    </div>`;
  box.innerHTML = `<div class="task-head"><span class="task-type">${TN[t.type]}</span>
    <button class="task-remove" onclick="copyTask()">Kopieren</button>
    <button class="task-remove" onclick="rmTask()">Entfernen</button></div>${body}`;
  return box;
}

const T = () => course.pages[pi].task;
const addOpt = () => { T().opts.push(''); renderEdit(); };
const rmOpt = i => { const t = T(); if (t.opts.length <= 2) return toast('Mindestens zwei Antworten nötig.'); t.opts.splice(i, 1); if (t.correct >= t.opts.length) t.correct = 0; renderEdit(); };
const addPair = () => { T().pairs.push({ term: '', def: '' }); renderEdit(); };
const rmPair = i => { const t = T(); if (t.pairs.length <= 2) return toast('Mindestens zwei Paare nötig.'); t.pairs.splice(i, 1); renderEdit(); };

/* ---------- Bild oder Text bei Zuordnen-Paaren ---------- */
const isImgVal = v => /^data:image\//i.test((v || '').trim()) || isImg((v || '').trim());

function pairSideEditor(value, side, i) {
  if (isImgVal(value)) {
    return `<div class="pair-side pair-side-img">
      <img src="${attr(value.trim())}">
      <button class="pair-img-rm" onclick="clearPairImage(${i}, '${side}')" title="Bild entfernen">✕</button>
    </div>`;
  }
  return `<div class="pair-side" ondragover="onPairDragOver(event)" ondragleave="onPairDragLeave(event)" ondrop="onPairDrop(event, ${i}, '${side}')">
    <input type="text" value="${attr(value)}" placeholder="${side === 'term' ? 'Begriff' : 'Definition'}"
      oninput="onPairTextInput(${i}, '${side}', this.value)" onpaste="onPairPaste(event, ${i}, '${side}')">
  </div>`;
}

// Falls statt eines Bildes eine Bild-Adresse (data:image/... oder Bild-Link) als Text getippt
// oder eingefügt wurde (z. B. über „Bildadresse kopieren"), sofort als Bild anzeigen.
function onPairTextInput(i, side, value) {
  T().pairs[i][side] = value;
  if (isImgVal(value)) renderEdit();
}

function setPairImage(i, side, file) {
  processImageFile(file, dataUrl => { T().pairs[i][side] = dataUrl; renderEdit(); });
}
function clearPairImage(i, side) { T().pairs[i][side] = ''; renderEdit(); }

function onPairPaste(e, i, side) {
  const img = [...(e.clipboardData.items || [])].find(it => it.type && it.type.startsWith('image/'));
  if (!img) return; // normaler Text-Paste läuft ganz normal weiter
  e.preventDefault();
  const file = img.getAsFile();
  if (file) setPairImage(i, side, file);
}

function onPairDragOver(e) { e.preventDefault(); e.currentTarget.classList.add('drop'); }
function onPairDragLeave(e) { e.currentTarget.classList.remove('drop'); }
function onPairDrop(e, i, side) {
  e.preventDefault(); e.currentTarget.classList.remove('drop');
  dropImageOnPair(e, i, side);
}

// Auffangnetz für die ganze Zeile: trifft automatisch das nähere Feld (links = Begriff, rechts = Definition)
function onRowDragOver(e) { e.preventDefault(); e.currentTarget.classList.add('row-drop'); }
function onRowDragLeave(e) { e.currentTarget.classList.remove('row-drop'); }
function onRowDrop(e, i) {
  e.preventDefault(); e.currentTarget.classList.remove('row-drop');
  const r = e.currentTarget.getBoundingClientRect();
  const side = (e.clientX - r.left) < r.width / 2 ? 'term' : 'def';
  dropImageOnPair(e, i, side);
}

function dropImageOnPair(e, i, side) {
  const files = [...(e.dataTransfer.files || [])].filter(f => f.type.startsWith('image/'));
  if (files.length) return setPairImage(i, side, files[0]);
  const txt = (e.dataTransfer.getData('text/uri-list') || e.dataTransfer.getData('text/plain') || '').trim();
  if (txt && isImg(txt)) { T().pairs[i][side] = txt; renderEdit(); }
  else toast('Bitte ein Bild oder einen Bild-Link hierher ziehen.');
}
const addItem = () => { T().items.push(''); renderEdit(); };
const rmItem = i => { const t = T(); if (t.items.length <= 2) return toast('Mindestens zwei Schritte nötig.'); t.items.splice(i, 1); renderEdit(); };

const addMultiOpt = () => { T().opts.push(''); renderEdit(); };
const rmMultiOpt = i => {
  const t = T(); if (t.opts.length <= 3) return toast('Mindestens drei Antworten nötig.');
  t.opts.splice(i, 1);
  t.correct = t.correct.filter(x => x !== i).map(x => x > i ? x - 1 : x);
  if (!t.correct.length) t.correct = [0];
  renderEdit();
};
const toggleMulti = (i, on) => {
  const t = T();
  if (on) { if (!t.correct.includes(i)) t.correct.push(i); }
  else { if (t.correct.length <= 1) { toast('Mindestens eine richtige Antwort nötig.'); return renderEdit(); } t.correct = t.correct.filter(x => x !== i); }
};
const addAnswer = () => { T().answers.push(''); renderEdit(); };
const rmAnswer = i => { const t = T(); if (t.answers.length <= 1) return toast('Mindestens eine Lösung nötig.'); t.answers.splice(i, 1); renderEdit(); };

/* ================= Schüleransicht ================= */
function renderProgress() {
  const el = document.getElementById('progress');
  const atSummary = playIdx >= course.pages.length;
  el.innerHTML = course.pages.map((_, i) =>
    `<i class="${i < playIdx || atSummary ? 'done' : i === playIdx ? 'now' : ''}"></i>`).join('');
}

function taskScore() {
  const tasks = course.pages.filter(p => p.task).map(p => p.task);
  const total = tasks.length;
  const firstTry = tasks.filter(t => !wrongTries[t.id]).length;
  const totalWrong = tasks.reduce((sum, t) => sum + (wrongTries[t.id] || 0), 0);
  return { total, firstTry, totalWrong };
}

function renderPlay() {
  if (playIdx >= course.pages.length) return renderSummary();
  const p = course.pages[playIdx];
  const w = document.getElementById('play');
  const done = !p.task || solved[p.id];
  const last = playIdx === course.pages.length - 1;
  w.innerHTML = `
    <div class="sheet">
      ${p.title ? `<h1>${esc(p.title)}</h1>` : ''}
      <div class="article">${p.html || ''}</div>
      ${p.task ? '<div class="task" id="taskArea"></div>' : ''}
    </div>
    <div class="nav"><div class="nav-inner">
      ${playIdx > 0 ? '<button onclick="go(-1)">Zurück</button>' : ''}
      <span class="count">${playIdx + 1}/${course.pages.length}</span>
      <button class="main" onclick="go(1)" ${!done ? 'disabled' : ''}>${last ? 'Auswertung ansehen' : 'Weiter'}</button>
    </div>
    ${!done ? '<div class="locked-note">Löse die Aufgabe, um fortzufahren.</div>' : ''}</div>
  `;
  if (p.task) renderTask(p, document.getElementById('taskArea'));
  renderProgress();
  document.getElementById('courseTitle').value = course.title;
}

function renderSummary() {
  const w = document.getElementById('play');
  const { total, firstTry, totalWrong } = taskScore();
  w.innerHTML = `
    <div class="sheet">
      <h1>Auswertung</h1>
      ${course.endHtml ? `<div class="article">${course.endHtml}</div>` : ''}
      <div class="score-box">
        ${total > 0 ? `
          <div class="score-row"><span>Aufgaben bearbeitet</span><strong>${total}</strong></div>
          <div class="score-row"><span>Beim ersten Versuch richtig</span><strong>${firstTry} von ${total}</strong></div>
          <div class="score-row"><span>Falsche Versuche insgesamt</span><strong>${totalWrong}</strong></div>
        ` : `<p class="score-empty">Diese Lektion enthielt keine Aufgaben zum Auswerten.</p>`}
      </div>
    </div>
    <div class="nav"><div class="nav-inner">
      <button onclick="go(-1)">Zurück zur Lektion</button>
      <span class="count">Abgeschlossen</span>
    </div></div>
  `;
  renderProgress();
  document.getElementById('courseTitle').value = course.title;
}

function go(d) {
  const j = playIdx + d;
  if (j < 0 || j > course.pages.length) return;
  playIdx = j; renderPlay(); window.scrollTo({ top: 0, behavior: 'smooth' });
}
function done(pid) { solved[pid] = true; renderPlayNav(); }
function wrong(tid) { wrongTries[tid] = (wrongTries[tid] || 0) + 1; }
function renderPlayNav() {
  const p = course.pages[playIdx];
  const btn = document.querySelector('.nav .main');
  const last = playIdx === course.pages.length - 1;
  if (btn) { btn.disabled = false; btn.textContent = last ? 'Auswertung ansehen' : 'Weiter'; }
  const note = document.querySelector('.locked-note'); if (note) note.remove();
}

function renderTask(page, host) {
  const t = page.task;
  const was = !!solved[page.id];   // in dieser Sitzung bereits gelöst

  if (t.type === 'mc') {
    host.innerHTML = `<p class="task-q">${esc(t.q)}</p><div id="o_${t.id}"></div><div class="fb" id="f_${t.id}"></div><div id="fx_${t.id}"></div>`;
    const wrap = document.getElementById('o_' + t.id), fb = document.getElementById('f_' + t.id), fx = document.getElementById('fx_' + t.id);
    t.opts.forEach((o, i) => {
      const b = document.createElement('button');
      b.className = 'opt'; b.textContent = o;
      if (was) { b.disabled = true; if (i === t.correct) b.classList.add('ok'); }
      b.onclick = () => {
        if (i === t.correct) {
          b.classList.add('ok'); fb.textContent = 'Richtig.'; fb.className = 'fb ok'; fx.innerHTML = fbExtraHtml(t, true);
          wrap.querySelectorAll('.opt').forEach(x => x.disabled = true); done(page.id);
        } else { b.classList.add('no'); fb.textContent = 'Noch nicht richtig.'; fb.className = 'fb no'; fx.innerHTML = fbExtraHtml(t, false); wrong(t.id); }
      };
      wrap.appendChild(b);
    });
    if (was) { fb.textContent = 'Richtig.'; fb.className = 'fb ok'; fx.innerHTML = fbExtraHtml(t, true); }
  }

  if (t.type === 'multi') {
    host.innerHTML = `<p class="task-q">${esc(t.q)}</p><div id="o_${t.id}"></div>
      <button class="check" id="k_${t.id}" ${was ? 'disabled' : ''}>Prüfen</button><div class="fb" id="f_${t.id}"></div><div id="fx_${t.id}"></div>`;
    const wrap = document.getElementById('o_' + t.id), fb = document.getElementById('f_' + t.id), kb = document.getElementById('k_' + t.id), fx = document.getElementById('fx_' + t.id);
    const picked = new Set(was ? t.correct : []);
    t.opts.forEach((o, i) => {
      const b = document.createElement('button');
      b.className = 'opt' + (was && t.correct.includes(i) ? ' ok' : '');
      b.textContent = o; b.disabled = was;
      b.onclick = () => {
        if (picked.has(i)) { picked.delete(i); b.classList.remove('sel'); }
        else { picked.add(i); b.classList.add('sel'); }
      };
      wrap.appendChild(b);
    });
    if (was) { fb.textContent = 'Richtig.'; fb.className = 'fb ok'; fx.innerHTML = fbExtraHtml(t, true); }
    kb.onclick = () => {
      const ok = picked.size === t.correct.length && [...picked].every(i => t.correct.includes(i));
      wrap.querySelectorAll('.opt').forEach((b, i) => {
        b.classList.remove('sel', 'ok', 'no');
        if (picked.has(i)) b.classList.add(t.correct.includes(i) ? 'ok' : 'no');
      });
      if (ok) {
        fb.textContent = 'Richtig.'; fb.className = 'fb ok'; fx.innerHTML = fbExtraHtml(t, true); kb.disabled = true;
        wrap.querySelectorAll('.opt').forEach(b => b.disabled = true); done(page.id);
      } else { fb.textContent = 'Noch nicht richtig — prüfe deine Auswahl.'; fb.className = 'fb no'; fx.innerHTML = fbExtraHtml(t, false); wrong(t.id); }
    };
  }

  if (t.type === 'truefalse') {
    host.innerHTML = `<p class="task-q">${esc(t.q)}</p><div id="o_${t.id}"></div><div class="fb" id="f_${t.id}"></div><div id="fx_${t.id}"></div>`;
    const wrap = document.getElementById('o_' + t.id), fb = document.getElementById('f_' + t.id), fx = document.getElementById('fx_' + t.id);
    [['Wahr', true], ['Falsch', false]].forEach(([label, val]) => {
      const b = document.createElement('button');
      b.className = 'opt'; b.textContent = label;
      if (was) { b.disabled = true; if (val === t.answer) b.classList.add('ok'); }
      b.onclick = () => {
        if (val === t.answer) {
          b.classList.add('ok'); fb.textContent = 'Richtig.'; fb.className = 'fb ok'; fx.innerHTML = fbExtraHtml(t, true);
          wrap.querySelectorAll('.opt').forEach(x => x.disabled = true); done(page.id);
        } else { b.classList.add('no'); fb.textContent = 'Noch nicht richtig.'; fb.className = 'fb no'; fx.innerHTML = fbExtraHtml(t, false); wrong(t.id); }
      };
      wrap.appendChild(b);
    });
    if (was) { fb.textContent = 'Richtig.'; fb.className = 'fb ok'; fx.innerHTML = fbExtraHtml(t, true); }
  }

  if (t.type === 'text') {
    host.innerHTML = `<p class="task-q">${esc(t.q)}</p>
      <input type="text" class="answer-in" id="a_${t.id}" placeholder="Deine Antwort"
        value="${was ? attr(t.answers[0]) : ''}" ${was ? 'disabled' : ''} autocomplete="off">
      <button class="check" id="k_${t.id}" ${was ? 'disabled' : ''}>Prüfen</button><div class="fb" id="f_${t.id}"></div><div id="fx_${t.id}"></div>`;
    const inp = document.getElementById('a_' + t.id), fb = document.getElementById('f_' + t.id), kb = document.getElementById('k_' + t.id), fx = document.getElementById('fx_' + t.id);
    if (was) { inp.classList.add('ok'); fb.textContent = 'Richtig.'; fb.className = 'fb ok'; fx.innerHTML = fbExtraHtml(t, true); }
    const chk = () => {
      const v = inp.value.trim().toLowerCase();
      const ok = v !== '' && t.answers.some(a => a.trim().toLowerCase() === v);
      inp.classList.remove('ok', 'no'); inp.classList.add(ok ? 'ok' : 'no');
      if (ok) { fb.textContent = 'Richtig.'; fb.className = 'fb ok'; fx.innerHTML = fbExtraHtml(t, true); inp.disabled = true; kb.disabled = true; done(page.id); }
      else { fb.textContent = 'Noch nicht richtig.'; fb.className = 'fb no'; fx.innerHTML = fbExtraHtml(t, false); wrong(t.id); }
    };
    kb.onclick = chk;
    inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); chk(); } };
  }

  if (t.type === 'password') {
    host.innerHTML = `<p class="task-q">${esc(t.q || 'Gib das Lösungswort ein.')}</p>
      <input type="text" class="answer-in" id="a_${t.id}" placeholder="Lösungswort"
        value="${was ? attr(t.answers[0]) : ''}" ${was ? 'disabled' : ''} autocomplete="off">
      <button class="check" id="k_${t.id}" ${was ? 'disabled' : ''}>Prüfen</button><div class="fb" id="f_${t.id}"></div><div id="fx_${t.id}"></div>`;
    const inp = document.getElementById('a_' + t.id), fb = document.getElementById('f_' + t.id), kb = document.getElementById('k_' + t.id), fx = document.getElementById('fx_' + t.id);
    if (was) { inp.classList.add('ok'); fb.textContent = 'Richtig.'; fb.className = 'fb ok'; fx.innerHTML = fbExtraHtml(t, true); }
    const chk = () => {
      const v = inp.value.trim().toLowerCase();
      const ok = v !== '' && t.answers.some(a => a.trim().toLowerCase() === v);
      inp.classList.remove('ok', 'no'); inp.classList.add(ok ? 'ok' : 'no');
      if (ok) { fb.textContent = 'Richtig.'; fb.className = 'fb ok'; fx.innerHTML = fbExtraHtml(t, true); inp.disabled = true; kb.disabled = true; done(page.id); }
      else { fb.textContent = 'Noch nicht richtig — Lösungswort prüfen.'; fb.className = 'fb no'; fx.innerHTML = fbExtraHtml(t, false); wrong(t.id); }
    };
    kb.onclick = chk;
    inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); chk(); } };
  }

  if (t.type === 'dragdrop') {
    host.innerHTML = `<p class="task-q">Ordne die Begriffe den Definitionen zu.</p>
      <div class="dd"><div id="c_${t.id}"></div><div id="s_${t.id}"></div></div>
      <button class="check" id="k_${t.id}">Prüfen</button><div class="fb" id="f_${t.id}"></div><div id="fx_${t.id}"></div>`;
    const terms = was ? t.pairs.map((p, i) => ({ i, text: p.term })) : shuffle(t.pairs.map((p, i) => ({ i, text: p.term })));
    const cw = document.getElementById('c_' + t.id), sw = document.getElementById('s_' + t.id);
    const fb = document.getElementById('f_' + t.id), kb = document.getElementById('k_' + t.id), fx = document.getElementById('fx_' + t.id);
    const put = {}; let sel = null;
    if (was) t.pairs.forEach((_, i) => put[i] = i);
    const draw = () => {
      cw.innerHTML = ''; sw.innerHTML = '';
      terms.forEach(tm => {
        const c = document.createElement('div');
        c.className = 'chip' + (sel === tm.i ? ' sel' : '') + (Object.values(put).includes(tm.i) ? ' used' : '');
        c.innerHTML = isImgVal(tm.text) ? `<img src="${attr(tm.text.trim())}">` : esc(tm.text);
        if (!was) c.onclick = () => { sel = sel === tm.i ? null : tm.i; draw(); };
        cw.appendChild(c);
      });
      t.pairs.forEach((p, si) => {
        const s = document.createElement('div');
        s.className = 'slot' + (was ? ' ok' : '');
        const cur = put[si] != null ? t.pairs[put[si]].term : '';
        const defHtml = isImgVal(p.def) ? `<img src="${attr(p.def.trim())}">` : esc(p.def);
        const curHtml = cur ? (isImgVal(cur) ? `<img src="${attr(cur.trim())}">` : esc(cur)) : '';
        s.innerHTML = `<div class="d">${defHtml}</div>${curHtml ? `<div class="a">${curHtml}</div>` : ''}`;
        if (!was) s.onclick = () => {
          if (sel != null) { Object.keys(put).forEach(k => { if (put[k] === sel) delete put[k]; }); put[si] = sel; sel = null; }
          else if (put[si] != null) delete put[si];
          draw();
        };
        sw.appendChild(s);
      });
    };
    draw();
    if (was) { kb.disabled = true; fb.textContent = 'Alles richtig zugeordnet.'; fb.className = 'fb ok'; fx.innerHTML = fbExtraHtml(t, true); }
    kb.onclick = () => {
      let all = true;
      sw.querySelectorAll('.slot').forEach((s, si) => {
        const ok = put[si] === si; s.classList.remove('ok', 'no'); s.classList.add(ok ? 'ok' : 'no'); if (!ok) all = false;
      });
      if (all) { fb.textContent = 'Alles richtig zugeordnet.'; fb.className = 'fb ok'; fx.innerHTML = fbExtraHtml(t, true); kb.disabled = true; done(page.id); }
      else { fb.textContent = 'Noch nicht alles richtig.'; fb.className = 'fb no'; fx.innerHTML = fbExtraHtml(t, false); wrong(t.id); }
    };
  }

  if (t.type === 'gap') {
    const segs = parseGaps(t.text);
    let bi = 0;
    host.innerHTML = `<p class="task-q">Fülle die Lücken.</p><p>` +
      segs.map(s => s.blank
        ? `<input class="gap-in${was ? ' ok' : ''}" id="g_${t.id}_${bi}" value="${was ? attr(s.text) : ''}" ${was ? 'disabled' : ''} autocomplete="off">${bi++, ''}`
        : esc(s.text)).join('') +
      `</p><button class="check" id="k_${t.id}" ${was ? 'disabled' : ''}>Prüfen</button><div class="fb" id="f_${t.id}"></div><div id="fx_${t.id}"></div>`;
    const fb = document.getElementById('f_' + t.id), kb = document.getElementById('k_' + t.id), fx = document.getElementById('fx_' + t.id);
    if (was) { fb.textContent = 'Alles richtig.'; fb.className = 'fb ok'; fx.innerHTML = fbExtraHtml(t, true); }
    kb.onclick = () => {
      let all = true;
      segs.filter(s => s.blank).forEach((s, i) => {
        const inp = document.getElementById('g_' + t.id + '_' + i);
        const ok = inp.value.trim().toLowerCase() === s.text.trim().toLowerCase();
        inp.classList.remove('ok', 'no'); inp.classList.add(ok ? 'ok' : 'no'); if (!ok) all = false;
      });
      if (all) {
        fb.textContent = 'Alles richtig.'; fb.className = 'fb ok'; fx.innerHTML = fbExtraHtml(t, true); kb.disabled = true;
        segs.filter(s => s.blank).forEach((s, i) => document.getElementById('g_' + t.id + '_' + i).disabled = true);
        done(page.id);
      } else { fb.textContent = 'Noch nicht alles richtig.'; fb.className = 'fb no'; fx.innerHTML = fbExtraHtml(t, false); wrong(t.id); }
    };
  }

  if (t.type === 'order') {
    host.innerHTML = `<p class="task-q">Bringe die Schritte in die richtige Reihenfolge.</p>
      <div id="l_${t.id}"></div><button class="check" id="k_${t.id}" ${was ? 'disabled' : ''}>Prüfen</button><div class="fb" id="f_${t.id}"></div><div id="fx_${t.id}"></div>`;
    let cur = was ? t.items.map((x, i) => ({ i, text: x })) : shuffle(t.items.map((x, i) => ({ i, text: x })));
    const lw = document.getElementById('l_' + t.id), fb = document.getElementById('f_' + t.id), kb = document.getElementById('k_' + t.id), fx = document.getElementById('fx_' + t.id);
    const draw = () => {
      lw.innerHTML = '';
      cur.forEach((it, idx) => {
        const r = document.createElement('div');
        r.className = 'ord' + (was ? ' ok' : '');
        r.innerHTML = `<span class="grip">${idx + 1}</span><span class="txt">${esc(it.text)}</span>` +
          (was ? '' : `<span class="mv"><button ${idx === 0 ? 'disabled' : ''}>▲</button><button ${idx === cur.length - 1 ? 'disabled' : ''}>▼</button></span>`);
        if (!was) {
          const [up, dn] = r.querySelectorAll('.mv button');
          up.onclick = () => { [cur[idx - 1], cur[idx]] = [cur[idx], cur[idx - 1]]; draw(); };
          dn.onclick = () => { [cur[idx + 1], cur[idx]] = [cur[idx], cur[idx + 1]]; draw(); };
          r.draggable = true;
          r.ondragstart = e => e.dataTransfer.setData('text/plain', idx);
          r.ondragover = e => e.preventDefault();
          r.ondrop = e => { e.preventDefault(); const f = +e.dataTransfer.getData('text/plain'); const [m] = cur.splice(f, 1); cur.splice(idx, 0, m); draw(); };
        }
        lw.appendChild(r);
      });
    };
    draw();
    if (was) { fb.textContent = 'Richtige Reihenfolge.'; fb.className = 'fb ok'; fx.innerHTML = fbExtraHtml(t, true); }
    kb.onclick = () => {
      let all = true;
      lw.querySelectorAll('.ord').forEach((r, idx) => {
        const ok = cur[idx].i === idx; r.classList.remove('ok', 'no'); r.classList.add(ok ? 'ok' : 'no'); if (!ok) all = false;
      });
      if (all) { fb.textContent = 'Richtige Reihenfolge.'; fb.className = 'fb ok'; fx.innerHTML = fbExtraHtml(t, true); kb.disabled = true; done(page.id); }
      else { fb.textContent = 'Noch nicht richtig.'; fb.className = 'fb no'; fx.innerHTML = fbExtraHtml(t, false); wrong(t.id); }
    };
  }
}

/* ================= Hilfen ================= */
function esc(s) { return (s || '').replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }
function attr(s) { return (s || '').replace(/"/g, '&quot;'); }
// Rückmeldungs-Zusatztext (Zusatzwissen bei richtig / Tipp bei falsch) für die Schüleransicht aufbereiten
function fbExtraHtml(t, ok) {
  const html = ok ? (t && t.fbCorrect) : (t && t.fbWrong);
  if (!html) return '';
  const bare = html.replace(/<[^>]*>/g, '').trim();
  if (!bare && !/<img\b|<iframe\b/i.test(html)) return '';
  return `<div class="fb-extra ${ok ? 'good' : 'hint'}">${html}</div>`;
}
function ytId(v) { if (!v) return ''; const m = v.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([A-Za-z0-9_-]{6,})/); return m ? m[1] : v.trim(); }
function shuffle(a) { const c = [...a]; for (let i = c.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [c[i], c[j]] = [c[j], c[i]]; } return c; }
function parseGaps(t) {
  const out = []; const re = /\*(.+?)\*/g; let last = 0, m;
  while ((m = re.exec(t))) { if (m.index > last) out.push({ blank: false, text: t.slice(last, m.index) }); out.push({ blank: true, text: m[1] }); last = re.lastIndex; }
  if (last < t.length) out.push({ blank: false, text: t.slice(last) });
  return out;
}

/* ================= Speichern / Laden / Export ================= */
function dl(name, content, type) {
  const b = new Blob([content], { type }), u = URL.createObjectURL(b);
  const a = document.createElement('a'); a.href = u; a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(u);
}
const slug = s => (s || 'lernstrecke').toLowerCase().replace(/[^a-z0-9äöüß]+/gi, '-').replace(/^-|-$/g, '');
// Ältere Kursdateien auf das aktuelle Format bringen
function normTask(t) {
  if (!t) return null;
  const o = { id: t.id || uid('t'), type: t.type, fbCorrect: t.fbCorrect || '', fbWrong: t.fbWrong || '' };
  if (t.type === 'mc') {
    o.q = t.q !== undefined ? t.q : (t.question || '');
    o.opts = t.opts || t.options || ['', ''];
    o.correct = t.correct !== undefined ? t.correct : (t.correctIndex || 0);
  } else if (t.type === 'multi') {
    o.q = t.q || ''; o.opts = t.opts || ['', '', ''];
    o.correct = Array.isArray(t.correct) ? t.correct : [0];
  } else if (t.type === 'truefalse') {
    o.q = t.q || ''; o.answer = t.answer !== false;
  } else if (t.type === 'text') {
    o.q = t.q || ''; o.answers = Array.isArray(t.answers) ? t.answers : [''];
  } else if (t.type === 'password') {
    o.q = t.q || ''; o.answers = Array.isArray(t.answers) ? t.answers : [''];
  } else if (t.type === 'dragdrop') o.pairs = t.pairs || [{ term: '', def: '' }, { term: '', def: '' }];
  else if (t.type === 'gap') o.text = t.text || '';
  else if (t.type === 'order') o.items = t.items || [];
  else return null;
  return o;
}

function applyCourse(d) {
  const endHtml = d.endHtml !== undefined ? d.endHtml
    : (d.summaryText ? `<p>${esc(d.summaryText).replace(/\n/g, '<br>')}</p>` : '');
  course = { title: d.title || 'Lernstrecke', endHtml, pages: (d.pages || []).map(p => ({
    id: p.id || uid('p'), title: p.title || '',
    html: p.html !== undefined ? p.html : (p.blocks ? p.blocks.map(b => b.html || '').join('') : ''),
    task: normTask(p.task || p.gate)
  })) };
  if (!course.pages.length) course.pages = [newPage()];
  pi = 0; codeMode = false; editingEnd = false;
  editHistory = {}; clearTimeout(histTimer); histFlushNow = false;
  document.getElementById('courseTitle').value = course.title;
  setMode('edit');
}

// Kursdaten aus einer bereits exportierten Lektionsdatei herausholen
function extractFromHTML(text) {
  const doc = new DOMParser().parseFromString(text, 'text/html');
  const tag = doc.getElementById('lektionsdaten');
  if (tag) return JSON.parse(tag.textContent.replace(/\\u003c/g, '<'));
  // ältere Exporte: course = {...} im Skript
  const m = text.match(/course\s*=\s*(\{[\s\S]*?\});\s*\n\s*mode\s*=/);
  if (m) return JSON.parse(m[1]);
  throw new Error('keine Lektionsdaten gefunden');
}

function loadCourse(e) {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    const text = r.result;
    try {
      const isHtml = /\.html?$/i.test(f.name) || /^\s*<!DOCTYPE html/i.test(text);
      applyCourse(isHtml ? extractFromHTML(text) : JSON.parse(text));
      toast('Lektion geladen — du kannst weiterarbeiten.');
    } catch (x) {
      toast('Datei konnte nicht gelesen werden.');
    }
  };
  r.readAsText(f); e.target.value = '';
}

function exportStudent() {
  dl(slug(course.title) + '.html', buildStudentHTML(), 'text/html');
}

  const css = document.querySelector('style').textContent;

  const data = JSON.stringify(course);
  return `<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>${esc(course.title)}</title>

mode='play'; playIdx=0; solved={};

<\/script></body></html>`;
}

<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Die Physik als Naturwissenschaft</title>
<style>
  :root {
    --ink: #16181d;
    --muted: #6b7280;
    --faint: #9ca3af;
    --line: #e5e7eb;
    --bg: #fbfbfa;
    --panel: #ffffff;
    --accent: #2f5d50;
    --accent-soft: #eef4f1;
    --warn: #a3432f;
    --radius: 10px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 17px; line-height: 1.6;
    -webkit-text-size-adjust: 100%;
  }

  /* ---------- Kopfzeile ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 30;
    background: rgba(251,251,250,0.92); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    padding: env(safe-area-inset-top) 0 0;
  }
  .topbar-inner {
    max-width: 46rem; margin: 0 auto; padding: 0.7rem 1rem;
    display: flex; align-items: center; gap: 0.6rem;
  }
  .course-title {
    flex: 1; min-width: 0; font-size: 0.95rem; font-weight: 600;
    border: none; background: none; color: var(--ink); padding: 0.2rem 0;
    font-family: inherit;
  }
  .course-title:focus { outline: none; }
  .topbar-actions { display: flex; gap: 0.3rem; flex-shrink: 0; }
  .icon-btn {
    width: 2.2rem; height: 2.2rem; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel); color: var(--muted); cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 0.95rem;
  }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
  .icon-btn.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .icon-btn.wide, .topbar-actions .icon-btn:not(#btnEdit):not(#btnPlay) {
    width: auto; padding: 0 0.7rem; font-size: 0.82rem; white-space: nowrap;
  }
  .icon-btn.wide { background: var(--accent); color: #fff; border-color: var(--accent); }
  .icon-btn.wide:hover { background: #24493f; color: #fff; }
  .tb-sep { width: 1px; height: 1.4rem; background: var(--line); margin: 0 0.15rem; flex-shrink: 0; }
  @media (max-width: 30rem) {
    .topbar-inner { flex-wrap: wrap; }
    .course-title { flex: 1 0 100%; margin-bottom: 0.3rem; }
    .topbar-actions { width: 100%; }
  }

  /* ---------- Seitenreiter ---------- */
  .page-tabs {
    display: flex; gap: 0.35rem; overflow-x: auto; padding: 0.5rem 1rem 0.7rem;
    max-width: 46rem; margin: 0 auto;
    scrollbar-width: none; -ms-overflow-style: none;
  }
  .page-tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex-shrink: 0; padding: 0.4rem 0.85rem; border-radius: 100px;
    border: 1px solid var(--line); background: var(--panel);
    font-size: 0.84rem; color: var(--muted); cursor: pointer; white-space: nowrap;
  }
  .tab.active { background: var(--ink); color: #fff; border-color: var(--ink); }
  .tab .dot { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--warn); margin-left: 0.35rem; vertical-align: middle; }
  .tab { touch-action: none; user-select: none; -webkit-user-select: none; }
  .tab.holding { opacity: 0.85; transform: scale(1.05); box-shadow: 0 4px 14px rgba(0,0,0,0.2); z-index: 5; position: relative; }
  .tab-wrap { display: flex; align-items: center; gap: 0.2rem; flex-shrink: 0; }
  .tab-add {
    flex-shrink: 0; width: 2rem; height: 2rem; border-radius: 50%;
    border: 1px dashed var(--faint); background: none; color: var(--muted);
    font-size: 1.1rem; line-height: 1; cursor: pointer;
  }
  .tab-add:hover { border-color: var(--accent); color: var(--accent); }

  /* ---------- Arbeitsfläche ---------- */
  main { max-width: 46rem; margin: 0 auto; padding: 1.2rem 1rem 8rem; }

  .page-name {
    width: 100%; font-size: 1.5rem; font-weight: 600; font-family: inherit;
    border: none; background: none; color: var(--ink); padding: 0 0 0.8rem;
    line-height: 1.3;
  }
  .page-name:focus { outline: none; }
  .page-name::placeholder { color: var(--faint); }

  /* ---------- Inhaltsfeld ---------- */
  .hide { display: none !important; }

  .canvas {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 1.1rem 1.1rem 3.4rem; min-height: 45vh; position: relative;
  }

  .editor img.media-sel, .editor iframe.media-sel { outline: 2px solid var(--accent); outline-offset: 2px; }
  .editor .zi.media-sel { outline: 2px solid var(--accent); outline-offset: 2px; }
  .editor img, .editor iframe { cursor: pointer; }
  .editor iframe { pointer-events: none; }

  .media-bar {
    position: absolute; z-index: 25; display: flex; align-items: center; gap: 0.15rem;
    background: var(--ink); border-radius: 8px; padding: 0.25rem; box-shadow: 0 4px 14px rgba(0,0,0,0.2);
  }
  .media-bar.hide { display: none; }
  .media-bar button {
    border: none; background: none; color: #fff; border-radius: 5px; cursor: pointer;
    font-size: 0.78rem; padding: 0.3rem 0.5rem; font-family: inherit; white-space: nowrap;
  }
  .media-bar button:hover { background: rgba(255,255,255,0.18); }
  .media-bar .mb-del { color: #ffb4a2; }
  .mb-sep { width: 1px; height: 1.1rem; background: rgba(255,255,255,0.25); margin: 0 0.1rem; }

  .res-handle {
    position: absolute; width: 18px; height: 18px; border-radius: 50%;
    background: var(--accent); border: 2px solid #fff; box-shadow: 0 1px 5px rgba(0,0,0,0.3);
    cursor: nwse-resize; z-index: 25; touch-action: none;
  }
  .res-handle.hide { display: none; }
  .editor { min-height: 40vh; font-size: 1rem; line-height: 1.7; }
  .zi-editor {
    min-height: 8rem; max-height: 45vh; overflow-y: auto; border: 1px solid var(--line);
    border-radius: 8px; padding: 0.6rem 0.75rem; background: var(--bg);
  }
  .zi-editor:focus { outline: none; border-color: var(--accent); }
  .editor:focus { outline: none; }
  .editor:empty:before { content: attr(data-ph); color: var(--faint); }
  .editor > *:first-child { margin-top: 0; }
  .editor h2 { font-size: 1.3rem; font-weight: 600; margin: 1.4rem 0 0.5rem; line-height: 1.3; }
  .editor h3 { font-size: 1.1rem; font-weight: 600; margin: 1.2rem 0 0.4rem; line-height: 1.35; }
  .editor p { margin: 0 0 0.9rem; }
  .editor ul, .editor ol { margin: 0 0 0.9rem; padding-left: 1.4rem; }
  .editor li { margin-bottom: 0.3rem; }
  .editor a { color: var(--accent); }
  .editor blockquote {
    margin: 0 0 0.9rem; padding: 0.1rem 0 0.1rem 0.9rem;
    border-left: 3px solid var(--line); color: var(--muted);
  }
  .editor img { max-width: 100%; height: auto; border-radius: 8px; display: block; margin: 1rem 0; }
  .editor iframe {
    width: 100%; aspect-ratio: 16/9; height: auto; border: none;
    border-radius: 8px; display: block; margin: 1rem 0; background: #f3f4f6;
  }
  .editor table { width: 100%; border-collapse: collapse; margin: 0 0 0.9rem; font-size: 0.94rem; }
  .editor th, .editor td { border: 1px solid var(--line); padding: 0.45rem 0.6rem; text-align: left; }
  .editor code { background: #f3f4f6; padding: 0.1rem 0.3rem; border-radius: 4px; font-size: 0.9em; }
  .editor .zi, .article .zi {
    margin: 1rem 0; border: 1px solid var(--accent); border-radius: 8px; background: var(--accent-soft); overflow: hidden;
  }
  .editor .zi.zi-holding { opacity: 0.85; box-shadow: 0 6px 18px rgba(0,0,0,0.18); position: relative; z-index: 5; }
  .editor .zi summary, .article .zi summary {
    padding: 0.7rem 1rem; cursor: pointer; font-weight: 500; color: var(--accent);
    list-style: none; display: flex; align-items: center; gap: 0.5rem;
  }
  .editor .zi summary { touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }
  .editor .zi.zi-holding summary { cursor: grabbing; }
  .editor .zi summary::-webkit-details-marker { display: none; }
  .editor .zi summary::before, .article .zi summary::before { content: '▸'; transition: transform .15s; }
  .editor .zi[open] summary::before, .article .zi[open] summary::before { transform: rotate(90deg); }
  .editor .zi-body, .article .zi-body { padding: 0 1rem 1rem; }
  .editor .zi-body p:first-child, .article .zi-body p:first-child { margin-top: 0; }
  .zi-title { flex: 1; }
  .editor .zi-grip { color: var(--accent); opacity: 0.6; flex-shrink: 0; font-size: 0.9rem; }
  .article .zi-grip { display: none; }
  .editor .zi-edit, .editor .zi-x {
    display: inline-flex; align-items: center; justify-content: center;
    width: 1.4rem; height: 1.4rem; border-radius: 50%; flex-shrink: 0;
    color: var(--accent); font-size: 0.75rem; cursor: pointer;
  }
  .editor .zi-edit:hover { background: rgba(0,0,0,0.08); }
  .editor .zi-x:hover { background: rgba(0,0,0,0.08); color: var(--warn); }
  .article .zi-edit, .article .zi-x { display: none; }

  .canvas-tools { position: absolute; bottom: 0.7rem; right: 0.7rem; display: flex; gap: 0.4rem; }
  .zi-btn, .code-btn {
    padding: 0.45rem 0.75rem; border-radius: 8px; font-size: 0.82rem; cursor: pointer; font-family: inherit;
  }
  .zi-btn { border: 1px dashed var(--accent); background: var(--accent-soft); color: var(--accent); }
  .zi-btn:hover { background: var(--accent); color: #fff; }
  .code-btn { border: 1px dashed var(--muted); background: var(--bg); color: var(--muted); }
  .code-btn:hover { background: var(--ink); color: #fff; border-color: var(--ink); }

  .code-view {
    width: 100%; min-height: 40vh; border: none; background: #1c1f24; color: #d8dee9;
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.85rem; line-height: 1.6;
    padding-bottom: 2.6rem; resize: vertical;
  }
  .code-view:focus { outline: none; }

  .insert {
    position: absolute; bottom: 0.7rem; right: 0.7rem;
  }
  .insert-btn {
    width: 2.1rem; height: 2.1rem; border-radius: 50%; border: 1px solid var(--line);
    background: var(--panel); color: var(--muted); font-size: 1.2rem; line-height: 1;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .insert-btn:hover { border-color: var(--accent); color: var(--accent); }
  .insert-menu {
    position: absolute; bottom: 2.6rem; right: 0; background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,0.1);
    padding: 0.3rem; display: flex; flex-direction: column; min-width: 11rem; z-index: 20;
  }
  .insert-menu.hide { display: none; }
  .insert-menu button {
    text-align: left; padding: 0.55rem 0.7rem; border: none; background: none;
    border-radius: 6px; cursor: pointer; font-size: 0.92rem; color: var(--ink); font-family: inherit;
  }
  .insert-menu button:hover { background: var(--accent-soft); }

  /* ---------- Seitenabschluss ---------- */
  .footer-zone { margin-top: 1.1rem; }
  .footer-label {
    font-size: 0.76rem; color: var(--faint); text-transform: uppercase;
    letter-spacing: 0.05em; margin-bottom: 0.5rem;
  }
  .footer-choice { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
  .footer-status {
    padding: 0.55rem 0.9rem; font-size: 0.9rem; color: var(--accent); font-weight: 500;
  }
  .choice-pill {
    padding: 0.55rem 1rem; border-radius: 8px; font-size: 0.9rem; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--muted); font-family: inherit;
  }
  .choice-pill:hover { border-color: var(--accent); }
  .choice-pill.paste-pill { border-style: dashed; color: var(--accent); border-color: #9fbdb0; }
  .choice-pill.paste-pill:hover { background: var(--accent-soft); }

  .task-box {
    background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--warn);
    border-radius: var(--radius); padding: 1rem; margin-top: 0.6rem;
  }
  .task-head { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.8rem; }
  .task-type { font-size: 0.8rem; color: var(--warn); font-weight: 600; flex: 1; }
  .task-remove { border: none; background: none; color: var(--faint); cursor: pointer; font-size: 0.85rem; padding: 0.2rem; }
  .task-remove:hover { color: var(--warn); }

  .fld { display: block; font-size: 0.78rem; color: var(--muted); margin: 0.7rem 0 0.25rem; }
  input[type=text], input[type=url], input[type=number], textarea {
    width: 100%; font-family: inherit; font-size: 0.95rem; padding: 0.6rem 0.7rem;
    border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink);
  }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); }
  textarea { min-height: 4.5rem; resize: vertical; line-height: 1.5; }
  .row { display: flex; gap: 0.5rem; align-items: center; margin-bottom: 0.45rem; }
  .row input { flex: 1; }
  .row .rm { border: none; background: none; color: var(--faint); cursor: pointer; font-size: 0.9rem; padding: 0.3rem; flex-shrink: 0; }

  .pair-row { align-items: stretch; }
  .pair-side { flex: 1; display: flex; gap: 0.3rem; align-items: center; min-width: 0; border-radius: 8px; transition: background .15s, box-shadow .15s; }
  .pair-side.drop { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent); }
  .pair-row.row-drop { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent); border-radius: 8px; }
  .pair-side input[type=text] { flex: 1; margin: 0; }
  .pair-side-img {
    position: relative; flex: 1; border: 1px solid var(--line); border-radius: 8px; padding: 0.3rem;
    display: flex; align-items: center; justify-content: center; min-height: 2.3rem; background: var(--bg);
  }
  .pair-side-img img { max-width: 100%; max-height: 4.5rem; height: auto; border-radius: 4px; display: block; }
  .pair-img-rm {
    position: absolute; top: -0.4rem; right: -0.4rem; width: 1.3rem; height: 1.3rem; border-radius: 50%;
    border: 1px solid var(--line); background: var(--panel); color: var(--warn); font-size: 0.65rem; cursor: pointer; padding: 0;
  }
  .row .rm:hover { color: var(--warn); }
  .radio-lbl { display: flex; align-items: center; gap: 0.3rem; font-size: 0.82rem; color: var(--muted); flex-shrink: 0; }
  .add-row {
    font-size: 0.85rem; padding: 0.45rem 0.8rem; border: 1px dashed var(--line);
    background: none; border-radius: 8px; cursor: pointer; color: var(--accent); font-family: inherit;
  }
  .add-row:hover { border-color: var(--accent); }
  .hint { font-size: 0.8rem; color: var(--faint); margin-top: 0.3rem; }

  .page-tools { display: flex; gap: 0.5rem; margin-top: 1.6rem; }
  .page-tools button {
    font-size: 0.84rem; padding: 0.45rem 0.8rem; border: 1px solid var(--line);
    background: var(--panel); border-radius: 8px; cursor: pointer; color: var(--muted); font-family: inherit;
  }
  .page-tools button:hover { border-color: var(--warn); color: var(--warn); }

  /* ---------- Schüleransicht ---------- */
  #play { display: none; }
  .progress { display: flex; gap: 3px; max-width: 46rem; margin: 0 auto; padding: 0 1rem 0.8rem; }
  .progress i { flex: 1; height: 3px; border-radius: 2px; background: var(--line); transition: background .3s; }
  .progress i.done { background: var(--accent); }
  .progress i.now { background: var(--ink); }

  .sheet {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 1.4rem 1.2rem; margin-bottom: 1rem;
  }
  .sheet h1 { font-size: 1.45rem; font-weight: 600; margin: 0 0 1rem; line-height: 1.3; }

  .score-box { margin-top: 1.2rem; border-top: 1px solid var(--line); padding-top: 1.2rem; }
  .score-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0.6rem 0; border-bottom: 1px solid var(--line); font-size: 0.98rem;
  }
  .score-row:last-child { border-bottom: none; }
  .score-row strong { font-size: 1.05rem; }
  .score-empty { color: var(--muted); font-size: 0.95rem; }
  .article > *:first-child { margin-top: 0; }
  .article h2 { font-size: 1.25rem; font-weight: 600; margin: 1.4rem 0 0.5rem; line-height: 1.3; }
  .article h3 { font-size: 1.08rem; font-weight: 600; margin: 1.2rem 0 0.4rem; }
  .article p { margin: 0 0 0.9rem; }
  .article ul, .article ol { margin: 0 0 0.9rem; padding-left: 1.4rem; }
  .article li { margin-bottom: 0.3rem; }
  .article a { color: var(--accent); }
  .article blockquote { margin: 0 0 0.9rem; padding: 0.1rem 0 0.1rem 0.9rem; border-left: 3px solid var(--line); color: var(--muted); }
  .article img { max-width: 100%; height: auto; border-radius: 8px; display: block; margin: 1rem 0; }
  .article iframe { width: 100%; aspect-ratio: 16/9; height: auto; border: none; border-radius: 8px; display: block; margin: 1rem 0; }
  .article table { width: 100%; border-collapse: collapse; margin: 0 0 0.9rem; font-size: 0.94rem; }
  .article th, .article td { border: 1px solid var(--line); padding: 0.45rem 0.6rem; text-align: left; }

  .task {
    margin-top: 1.6rem; padding-top: 1.4rem; border-top: 1px solid var(--line);
  }
  .task-q { font-weight: 600; margin: 0 0 1rem; }
  .opt {
    display: block; width: 100%; text-align: left; padding: 0.8rem 1rem; margin-bottom: 0.5rem;
    border: 1px solid var(--line); background: var(--panel); border-radius: 8px;
    cursor: pointer; font-size: 0.98rem; font-family: inherit; color: var(--ink);
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); }
  .opt.ok { border-color: var(--accent); background: var(--accent-soft); }
  .opt.no { border-color: var(--warn); background: #fdf1ee; }
  .opt:disabled { cursor: default; }
  .fb { font-size: 0.9rem; margin-top: 0.7rem; min-height: 1.2em; }
  .fb.ok { color: var(--accent); }
  .fb.no { color: var(--warn); }
  .check {
    margin-top: 0.9rem; padding: 0.7rem 1.3rem; background: var(--ink); color: #fff;
    border: none; border-radius: 8px; cursor: pointer; font-size: 0.95rem; font-family: inherit;
  }
  .check:disabled { opacity: 0.4; }

  .dd { display: grid; gap: 0.9rem; }
  @media (min-width: 34rem) { .dd { grid-template-columns: 1fr 1fr; } }
  .chip {
    padding: 0.65rem 0.85rem; margin-bottom: 0.45rem; background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; font-size: 0.94rem; cursor: pointer;
  }
  .chip.sel { border-color: var(--ink); background: var(--ink); color: #fff; }
  .chip.used { opacity: 0.35; }
  .chip img { max-width: 100%; max-height: 7rem; height: auto; display: block; margin: 0 auto; border-radius: 4px; }
  .slot {
    padding: 0.65rem 0.85rem; margin-bottom: 0.45rem; min-height: 3.4rem;
    border: 1px dashed var(--line); border-radius: 8px; background: var(--bg); font-size: 0.9rem; cursor: pointer;
  }
  .slot .d { color: var(--muted); font-size: 0.88rem; }
  .slot .d img, .slot .a img { max-width: 100%; max-height: 7rem; height: auto; display: block; margin: 0.2rem auto; border-radius: 4px; }
  .slot .a { font-weight: 600; margin-top: 0.3rem; }
  .slot.ok { border-color: var(--accent); border-style: solid; }
  .slot.no { border-color: var(--warn); border-style: solid; }
  .gap-in {
    display: inline-block; width: 7rem; padding: 0.2rem 0.4rem; margin: 0 0.15rem;
    border: none; border-bottom: 2px solid var(--accent); background: var(--accent-soft);
    border-radius: 4px 4px 0 0; font-size: inherit; font-family: inherit; text-align: center;
  }
  .gap-in.ok { background: #dcebe4; }
  .gap-in.no { background: #fdf1ee; border-color: var(--warn); }
  .ord {
    padding: 0.75rem 0.9rem; margin-bottom: 0.45rem; background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; font-size: 0.95rem;
    display: flex; align-items: center; gap: 0.7rem;
  }
  .ord .grip { color: var(--faint); font-size: 0.9rem; }
  .ord .txt { flex: 1; }
  .ord .mv { display: flex; flex-direction: column; gap: 2px; }
  .ord .mv button {
    border: 1px solid var(--line); background: var(--panel); border-radius: 5px;
    width: 1.8rem; height: 1.4rem; cursor: pointer; font-size: 0.7rem; color: var(--muted); padding: 0;
  }
  .ord .mv button:hover { border-color: var(--accent); color: var(--accent); }
  .ord.ok { border-color: var(--accent); background: var(--accent-soft); }
  .ord.no { border-color: var(--warn); background: #fdf1ee; }

  .nav {
    position: sticky; bottom: 0; background: rgba(251,251,250,0.94); backdrop-filter: blur(10px);
    border-top: 1px solid var(--line); padding: 0.7rem 1rem calc(0.7rem + env(safe-area-inset-bottom));
    margin: 0 -1rem;
  }
  .nav-inner { max-width: 46rem; margin: 0 auto; display: flex; align-items: center; gap: 0.7rem; }
  .nav button {
    padding: 0.8rem 1.3rem; border-radius: 8px; font-size: 0.95rem; cursor: pointer; font-family: inherit;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  }
  .nav button.main { flex: 1; background: var(--ink); color: #fff; border-color: var(--ink); font-weight: 500; }
  .nav button:disabled { opacity: 0.35; cursor: not-allowed; }
  .nav .count { font-size: 0.85rem; color: var(--faint); flex-shrink: 0; }
  .locked-note { font-size: 0.85rem; color: var(--warn); text-align: center; margin-top: 0.5rem; }

  /* ---------- Modal ---------- */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex;
    align-items: flex-end; justify-content: center; z-index: 60; padding: 0; }
  @media (min-width: 34rem) { .modal { align-items: center; padding: 1rem; } }
  .modal.hide { display: none; }
  .modal-box {
    background: var(--panel); border-radius: 16px 16px 0 0; padding: 1.3rem 1.1rem calc(1.3rem + env(safe-area-inset-bottom));
    width: 100%; max-width: 26rem;
  }
  @media (min-width: 34rem) { .modal-box { border-radius: 14px; padding-bottom: 1.3rem; } }
  .modal-box h3 { margin: 0 0 1rem; font-size: 1.1rem; font-weight: 600; }
  .modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.8rem; }
  .modal-head h3 { flex: 1; }
  .modal-x {
    flex-shrink: 0; width: 1.8rem; height: 1.8rem; border-radius: 50%; border: none;
    background: var(--bg); color: var(--muted); cursor: pointer; font-size: 0.85rem;
    display: flex; align-items: center; justify-content: center; margin-top: -0.15rem;
  }
  .modal-x:hover { background: var(--line); color: var(--ink); }
  .modal-box .opts { display: flex; flex-direction: column; gap: 0.5rem; }
  .modal-box .opts button {
    padding: 0.9rem 1rem; border: 1px solid var(--line); border-radius: 10px; background: var(--bg);
    cursor: pointer; font-size: 0.98rem; text-align: left; font-family: inherit; color: var(--ink);
  }
  .modal-box .opts button:hover { border-color: var(--accent); background: var(--accent-soft); }
  .modal-box .opts small { display: block; color: var(--muted); font-size: 0.82rem; margin-top: 0.15rem; }
  .modal-cancel { width: 100%; margin-top: 0.8rem; padding: 0.75rem; border: none; background: none;
    color: var(--muted); cursor: pointer; font-size: 0.95rem; font-family: inherit; }

  .dlg-btns { display: flex; gap: 0.5rem; margin-top: 1rem; }
  .dlg-btns button {
    flex: 1; padding: 0.75rem; border-radius: 8px; cursor: pointer; font-size: 0.95rem; font-family: inherit;
  }
  .dlg-cancel { border: 1px solid var(--line); background: var(--panel); color: var(--muted); }
  .dlg-ok { border: none; background: var(--ink); color: #fff; }
  .dlg-ok.danger { background: var(--warn); }

  .toast {
    position: fixed; left: 50%; bottom: 1.5rem; transform: translateX(-50%) translateY(1rem);
    background: var(--ink); color: #fff; padding: 0.7rem 1.1rem; border-radius: 8px;
    font-size: 0.9rem; z-index: 80; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
    max-width: 90vw; text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .opt.sel { border-color: var(--ink); background: #eef0f3; font-weight: 500; }
  .answer-in {
    width: 100%; padding: 0.8rem 1rem; border: 1px solid var(--line); border-radius: 8px;
    background: var(--panel); font-size: 1rem; font-family: inherit;
  }
  .answer-in:focus { outline: none; border-color: var(--accent); }
  .answer-in.ok { border-color: var(--accent); background: var(--accent-soft); }
  .answer-in.no { border-color: var(--warn); background: #fdf1ee; }

  .editor.drop { border-color: var(--accent); background: var(--accent-soft); }
  .modal-box.wide { max-width: 34rem; }
  .ai-intro { font-size: 0.9rem; color: var(--muted); margin: 0 0 0.8rem; }
  .copy-prompt {
    width: 100%; padding: 0.7rem; border: 1px solid var(--accent); background: var(--accent-soft);
    color: var(--accent); border-radius: 8px; cursor: pointer; font-size: 0.92rem; font-family: inherit;
    margin-bottom: 0.5rem;
  }
  .copy-prompt:hover { background: var(--accent); color: #fff; }
  .modal-box .opts button.ai-opt { border-style: dashed; border-color: var(--accent); color: var(--accent); }
  #aiErr { min-height: 0; }
  #aiErr:not(:empty) { margin-top: 0.5rem; }

/r1/wB6uos/vX//AF2H/oRq5ExOfm+83+/T4/8AVmmTfeb/AH6fH/qzQ9hLcqx9V/3h/MVct/8Aj+i/66L/ADFU4+q/7w/mKuW//H9F/wBdF/mKct2JbFGD/kIv/wBdT/M02T/Wn6mnQf8AIRf/AK6n+Zpsn+tP1NNbAzV1P/VRfT+lYUPRvp/Wt3U/9VF9P6VhQ9G+n9amIS6mgv8AyC5v+uy/+zVUtP8AXv8AQ1bX/kFzf9dl/wDZqqWn+vf6GtVsyHuiw33mrp9c/wCQLon/AF5y/wDpRJXMN95q6fXP+QLon/XnL/6USVDLfU5E/wDHvJ9V/rXr2jf8gzVP+ve0/wDRMVeQn/j3k+q/1r17Rv8AkGap/wBe9p/6Jirz8y2h6r/0qJ1YP7Xz/JnI2/8AyJ15/wBhEf8AoqtbSv8Akll//wBhL/2mlZNv/wAidef9hEf+iq1tK/5JZf8A/YS/9ppXPX6/9fI/oa0t/wDtxnJaT/rD/wBekv8A6A1fU9h/yPdp/ut/6Tz18saT/rD/ANekv/oDV9T2H/I92n+63/pPPXkcT7P/AAz/ACR6GTdP8UTyXW/+P5P9wf0rze7/AOQs34/yr0jW/wDj+T/cH9K83u/+Qs34/wAq9LLf4fyOLGfF8zd8Wf8AIJ0L/r3l/wDQhXEDpXb+LP8AkE6F/wBe8v8A6EK4gdK78v8A4C9Zfmzmxfx/Jfkj/9k=\" class=\"\" style=\"width: clamp(220px, 55%, 100%); height: auto;\">","task":{"id":"t_5_5ng1","type":"mc","q":"Was ist die älteste Naturwissenschaft?","opts":["Astronomie","Biologie","Geologie","Archäologie"],"correct":0}},{"id":"p3","title":"Bereiche der Naturwissenschaft","html":"\u003cp>Biologie\u003c/p>\u003cp>Die Entstehung und Entwicklung allen Lebens wurde zum Untersuchungsgegenstand der Biologie. Die Menschen begannen, Pflanzen und Tiere zu züchten. Sie probierten aus, welche Pflanzen dem Menschen guttaten und ihn vor Krankheiten bewahrten.\u003c/p>\u003cp>\u003ciframe src=\"https://giphy.com/embed/8EvcxIrfrz3TG\" style=\"aspect-ratio: 480 / 475; width: clamp(160px, 30%, 100%); height: auto;\" allowfullscreen=\"\" loading=\"lazy\" referrerpolicy=\"strict-origin-when-cross-origin\" class=\"\">\u003c/iframe>\u003c/p>\u003cp>Chemie\u003c/p>\u003cp>Den Blick ins Innere der Stoffe und die Frage, was passiert mit den kleinsten Bauteilen, beschäftigt die Chemie. Sie beantwortet Fragen nach den Eigenschaften und dem Aufbau der Stoffe und untersucht, wie neue Stoffe mit neuen Eigenschaften hergestellt werden können.\u003c/p>\u003cp>\u003ciframe src=\"https://giphy.com/embed/l0HlDwsHgodoAZXiw\" style=\"aspect-ratio: 480 / 269; width: clamp(220px, 55%, 100%); height: auto;\" allowfullscreen=\"\" loading=\"lazy\" referrerpolicy=\"strict-origin-when-cross-origin\" class=\"\">\u003c/iframe>\u003c/p>\u003cp>Physik\u003c/p>\u003cp>Die Physik untersucht Vorgänge und Erscheinungen in der unbelebten Natur. Der Physiker beobachtet die Natur. Er misst und führt Experimente durch, um die Naturgesetze zu erkennen und noch besser zu verstehen. Viele dieser Kenntnisse werden in der Technik angewandt.\u003c/p>\u003cp>\u003ciframe src=\"https://giphy.com/embed/o65WgXSDBVY1G\" style=\"aspect-ratio: 480 / 360; width: clamp(220px, 55%, 100%); height: auto;\" allowfullscreen=\"\" loading=\"lazy\" referrerpolicy=\"strict-origin-when-cross-origin\" class=\"\">\u003c/iframe>\u003c/p>","task":{"id":"t_6_b1it","type":"truefalse","q":"Die Physik untersucht Erscheinungen von allen Naturerscheinungen.","answer":false}},{"id":"p5","title":"Teilgebiete der Physik","html":"\u003cp>Wir wissen nun, dass die Naturwissenschaften drei große Bereiche hat (Biologie, Physik und Chemie).\u003c/p>\u003cp>Jetzt geht es um die Teilbereiche in der Physik.\u003c/p>\u003cp>\u003ciframe src=\"https://learningapps.org/watch?app=414289\" allowfullscreen=\"\" loading=\"lazy\" referrerpolicy=\"strict-origin-when-cross-origin\">\u003c/iframe>\u003c/p>","task":{"id":"t_2_qm0u","type":"dragdrop","pairs":[{"term":"","def":"Wärmelehre"},{"term":"Bild 2 — Raketenstart","def":"Mechanik"},{"term":"Bild 3 — Blitz bei Nacht","def":"Elektrizitätslehre"},{"term":"Bild 4 — Lupe vor einem Auge","def":"Optik"}]}},{"id":"p7","title":"Meine ersten Mitschriften! Wie geht das?","html":"\u003cp>Diese Anleitung nimmst du, falls du noch keine Mitschriften digital auf dem iPad gemacht hast.\u003c/p>\u003col>\u003cli>Innerhalb der Mappe erstellst du eine erste Notiz und benennst diese nach dem Thema der Stunde \u003cstrong>„1. Die Physik eine Naturwissenschaft\"\u003c/strong>.\u003c/li>\u003cli>Füge nun die Mitschriften aus dieser Stunde in diesem Bereich ein.\u003c/li>\u003c/ol>\u003cp>\u003 <script>

/* ================= Datenmodell ================= */
let n = 1;
const uid = p => p + '_' + (n++) + '_' + Math.random().toString(36).slice(2, 6);

const newTask = t => ({
  mc:        () => ({ id: uid('t'), type: 'mc', q: '', opts: ['', ''], correct: 0 }),
  multi:     () => ({ id: uid('t'), type: 'multi', q: '', opts: ['', '', ''], correct: [0] }),
  truefalse: () => ({ id: uid('t'), type: 'truefalse', q: '', answer: true }),
  text:      () => ({ id: uid('t'), type: 'text', q: '', answers: [''] }),
  password:  () => ({ id: uid('t'), type: 'password', q: '', answers: [''] }),
  dragdrop:  () => ({ id: uid('t'), type: 'dragdrop', pairs: [{ term: '', def: '' }, { term: '', def: '' }] }),
  gap:       () => ({ id: uid('t'), type: 'gap', text: 'Die *Frequenz* wird in *Hertz* gemessen.' }),
  order:     () => ({ id: uid('t'), type: 'order', items: ['Erster Schritt', 'Zweiter Schritt', 'Dritter Schritt'] })
}[t]());

const newPage = () => ({ id: uid('p'), title: '', html: '', task: null });

let course = { title: 'Meine Lernstrecke', pages: [newPage()] };
let mode = 'edit', pi = 0, playIdx = 0, solved = {}, wrongTries = {}, codeMode = false;

/* ================= Modus ================= */
function setMode(m) {
  mode = m;
  document.getElementById('edit').style.display = m === 'edit' ? 'block' : 'none';
  document.getElementById('play').style.display = m === 'play' ? 'block' : 'none';
  document.getElementById('btnEdit').classList.toggle('on', m === 'edit');
  document.getElementById('btnPlay').classList.toggle('on', m === 'play');
  document.getElementById('tabs').style.display = m === 'edit' ? 'flex' : 'none';
  document.getElementById('progress').style.display = m === 'play' ? 'flex' : 'none';
  document.getElementById('courseTitle').readOnly = m === 'play';
  // In der Vorschau nur zeigen, was Schüler auch wirklich sehen — Bearbeiten-Aktionen ausblenden
  document.getElementById('tbSep').style.display = m === 'play' ? 'none' : '';
  document.getElementById('btnOpenFile').style.display = m === 'play' ? 'none' : '';
  document.getElementById('btnSaveLesson').style.display = m === 'play' ? 'none' : '';
  if (m === 'play') { playIdx = 0; solved = {}; wrongTries = {}; renderPlay(); }
  else renderEdit();
}

/* ================= Bearbeiten ================= */
let tabHold = null;       // aktiver Halte-/Verschiebevorgang
let suppressTabClick = false;

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = '';
  course.pages.forEach((p, i) => {
    const wrap = document.createElement('span');
    wrap.className = 'tab-wrap';
    const b = document.createElement('button');
    b.className = 'tab' + (i === pi ? ' active' : '');
    b.innerHTML = (p.title ? esc(p.title.slice(0, 22)) : '<span style="opacity:.5">Ohne Titel</span>') + (p.task ? '<span class="dot"></span>' : '');
    b.onclick = () => { if (suppressTabClick) { suppressTabClick = false; return; } pi = i; codeMode = false; renderEdit(); };
    b.onpointerdown = e => startTabHold(e, i, b);
    wrap.appendChild(b);
    el.appendChild(wrap);
  });
  const add = document.createElement('button');
  add.className = 'tab-add'; add.textContent = '+'; add.title = 'Seite hinzufügen';
  add.onclick = () => { course.pages.push(newPage()); pi = course.pages.length - 1; codeMode = false; renderEdit(); window.scrollTo({ top: 0 }); };
  el.appendChild(add);
}

// Reiter festhalten (kurze Verzögerung), danach mit dem Finger/der Maus verschieben
function startTabHold(e, idx, el) {
  if (e.button !== undefined && e.button !== 0) return;
  const startX = e.clientX, startY = e.clientY, pid = e.pointerId;
  let active = false;

  const activate = () => {
    active = true;
    tabHold = { idx };
    el.classList.add('holding');
    try { el.setPointerCapture(pid); } catch (_) {}
  };
  const holdTimer = setTimeout(activate, 220);

  const onMove = ev => {
    if (!active) {
      if (Math.abs(ev.clientX - startX) > 10 || Math.abs(ev.clientY - startY) > 10) finish(false);
      return;
    }
    ev.preventDefault();
    const rail = document.getElementById('tabs');
    const tabs = [...rail.querySelectorAll('.tab')];
    let newIdx = tabs.length - 1;
    for (let k = 0; k < tabs.length; k++) {
      const r = tabs[k].getBoundingClientRect();
      if (ev.clientX < r.left + r.width / 2) { newIdx = k; break; }
    }
    if (newIdx !== tabHold.idx) {
      const [moved] = course.pages.splice(tabHold.idx, 1);
      course.pages.splice(newIdx, 0, moved);
      tabHold.idx = newIdx; pi = newIdx;
      renderTabs();
      const fresh = [...document.getElementById('tabs').querySelectorAll('.tab')][newIdx];
      if (fresh) { fresh.classList.add('holding'); try { fresh.setPointerCapture(pid); } catch (_) {} }
    }
  };
  const onUp = () => finish(active);
  function finish(wasActive) {
    clearTimeout(holdTimer);
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    document.removeEventListener('pointercancel', onUp);
    if (wasActive) {
      suppressTabClick = true;
      tabHold = null;
      renderEdit();
    }
  }
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
  document.addEventListener('pointercancel', onUp);
}

function renderEdit() {
  renderTabs();
  const p = course.pages[pi];
  const w = document.getElementById('edit');
  w.innerHTML = `
    <input class="page-name" id="pgName" value="${attr(p.title)}" placeholder="Seitentitel" oninput="setTitle(this.value)">
    <div class="canvas">
      ${codeMode ? `
        <textarea id="edCode" class="code-view" spellcheck="false" oninput="p_html(this.value)">${esc(prettyHtml(p.html))}</textarea>
      ` : `
        <div class="editor" id="ed" contenteditable="true"
             data-ph="Schreib los. Text einfügen, Bilder ziehen, Links und Einbettungscode einfach reinkopieren — wird automatisch erkannt."
             oninput="p_html(this.innerHTML)" onpaste="onPaste(event)" onblur="linkify()"
             onclick="onEdClick(event)" onpointerdown="onEdPointerDown(event)"
             ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event)">${p.html}</div>
      `}
      <div class="canvas-tools">
        ${codeMode ? '' : '<button class="zi-btn" onclick="openZiModal()" title="Aufklappbare Zusatzinfo einfügen (z. B. für den E-Kurs)">+ Zusatzinfo</button>'}
        <button class="code-btn" onclick="toggleCodeView()" title="${codeMode ? 'Zurück zur normalen Ansicht' : 'HTML-Code anzeigen, z. B. um ihn einer KI zum Umstyeln zu geben'}">${codeMode ? '✓ Fertig' : '</> Code'}</button>
      </div>
      <div class="media-bar hide" id="mediaBar"></div>
      <div class="res-handle hide" id="resHandle"></div>
    </div>
    <div class="footer-zone">
      <div class="footer-label">Am Ende der Seite</div>
      ${p.task ? '' : `
        <div class="footer-choice">
          <div class="footer-status">✓ Einfach weiter</div>
          <button class="choice-pill" onclick="openTaskModal()">Aufgabe zum Weiterkommen</button>
          ${clipboardTask ? `<button class="choice-pill paste-pill" onclick="pasteTask()" title="${esc(TN[clipboardTask.type])} — von „${esc(clipboardTask._fromPage || 'anderer Seite')}"">📋 Kopierte Aufgabe einfügen</button>` : ''}
        </div>`}
      <div id="taskEd"></div>
    </div>
    ${pi === course.pages.length - 1 ? `
      <div class="footer-zone">
        <div class="footer-label">Auswertung nach der Lektion (automatisch)</div>
        <p class="hint" style="margin-top:-0.2rem;margin-bottom:0.5rem;">Nach dieser Seite sehen Schüler automatisch eine Auswertung mit Punktzahl. Optional kannst du hier noch die wichtigsten Punkte der Lektion ergänzen.</p>
        <textarea placeholder="z. B. Wichtig war heute: Kraft wird in Newton gemessen, es gibt vier Grundkräfte …" oninput="course.summaryText=this.value">${esc(course.summaryText || '')}</textarea>
      </div>` : ''}
    <div class="page-tools">
      <button onclick="delPage()">Seite löschen</button>
    </div>
  `;
  if (p.task) document.getElementById('taskEd').appendChild(taskEditor(p.task));
}

const setTitle = v => { course.pages[pi].title = v; renderTabs(); };
const p_html = v => { course.pages[pi].html = v; };

/* ================= Eigene Dialoge (Browser-Dialoge werden in Vorschauen blockiert) ================= */
function ask(title, placeholder, preset, cb) {
  const m = document.getElementById('askModal');
  document.getElementById('askTitle').textContent = title;
  const inp = document.getElementById('askInput');
  inp.placeholder = placeholder || ''; inp.value = preset || '';
  m.classList.remove('hide');
  setTimeout(() => { inp.focus(); inp.select(); }, 50);
  window._askCb = cb;
}
function askOk() {
  const v = document.getElementById('askInput').value.trim();
  document.getElementById('askModal').classList.add('hide');
  const cb = window._askCb; window._askCb = null;
  if (cb && v) cb(v);
}
function askCancel() { document.getElementById('askModal').classList.add('hide'); window._askCb = null; }

function confirmBox(text, cb) {
  const m = document.getElementById('confModal');
  document.getElementById('confText').textContent = text;
  m.classList.remove('hide');
  window._confCb = cb;
}
function confOk() {
  document.getElementById('confModal').classList.add('hide');
  const cb = window._confCb; window._confCb = null; if (cb) cb();
}
function confCancel() { document.getElementById('confModal').classList.add('hide'); window._confCb = null; }

function toast(msg) {
  let t = document.getElementById('toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; document.body.appendChild(t); }
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window._tT); window._tT = setTimeout(() => t.classList.remove('show'), 2200);
}

function delPage() {
  if (course.pages.length < 2) return toast('Es muss mindestens eine Seite geben.');
  confirmBox('Diese Seite wirklich löschen?', () => {
    course.pages.splice(pi, 1); pi = Math.max(0, pi - 1); codeMode = false; renderEdit();
  });
}

/* ================= Einfügen ================= */
const ed = () => document.getElementById('ed');

function ins(html, target) {
  const e = target || ed(); if (!e) return;
  e.focus();
  const sel = window.getSelection();
  const inside = sel && sel.rangeCount && e.contains(sel.anchorNode);
  if (!inside) {   // kein Cursor im Feld -> ans Ende setzen
    const r = document.createRange();
    r.selectNodeContents(e); r.collapse(false);
    sel.removeAllRanges(); sel.addRange(r);
  }
  let ok = false;
  try { ok = document.execCommand('insertHTML', false, html); } catch (x) { ok = false; }
  if (!ok) e.insertAdjacentHTML('beforeend', html);
  if (e.id === 'ed') p_html(e.innerHTML); // nur die Hauptseite ist Teil des Kursmodells
}
/* ---------- Bild oder Einbettung anklicken, um Größe zu ändern ---------- */
let selMedia = null;
let selKind = null;

function onEdClick(e) {
  const editBtn = e.target.closest('.zi-edit');
  if (editBtn) {
    e.preventDefault(); e.stopPropagation();
    openZiModalEdit(editBtn.closest('details.zi'));
    return;
  }
  const xBtn = e.target.closest('.zi-x');
  if (xBtn) {
    e.preventDefault(); e.stopPropagation();
    const det = xBtn.closest('details.zi');
    confirmBox('Zusatzinfo wirklich entfernen?', () => {
      det.remove();
      p_html(ed().innerHTML);
    });
    return;
  }
  let m = e.target.closest('img, iframe');
  if (!m) {
    // iFrames haben pointer-events:none, damit der Klick überhaupt beim Editor ankommt
    // (sonst würde er im eingebetteten Inhalt verschwinden) — deshalb hier per Koordinaten prüfen
    for (const f of ed().querySelectorAll('iframe')) {
      const r = f.getBoundingClientRect();
      if (e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom) { m = f; break; }
    }
  }
  if (m && ed().contains(m)) selectMedia(m);
  else deselectMedia();
}

function selectMedia(el) {
  deselectMedia();
  selMedia = el;
  el.classList.add('media-sel');
  const bar = document.getElementById('mediaBar');
  bar.innerHTML = `
    <button onclick="setMediaWidth('clamp(160px, 30%, 100%)')">Klein</button>
    <button onclick="setMediaWidth('clamp(220px, 55%, 100%)')">Mittel</button>
    <button onclick="setMediaWidth('clamp(280px, 80%, 100%)')">Groß</button>
    <button onclick="setMediaWidth('100%')">Voll</button>
    <span class="mb-sep"></span>
    <button onclick="setMediaAlign('left')" title="Linksbündig">⇤</button>
    <button onclick="setMediaAlign('center')" title="Mittig">↔</button>
    <span class="mb-sep"></span>
    <button class="mb-del" onclick="deleteMedia()">Entfernen</button>
  `;
  positionMediaUI();
}

function deselectMedia() {
  if (selMedia) selMedia.classList.remove('media-sel');
  selMedia = null;
  const bar = document.getElementById('mediaBar'), h = document.getElementById('resHandle');
  if (bar) bar.classList.add('hide');
  if (h) h.classList.add('hide');
}

function positionMediaUI() {
  if (!selMedia) return;
  const canvas = selMedia.closest('.canvas');
  const cr = canvas.getBoundingClientRect(), mr = selMedia.getBoundingClientRect();
  const bar = document.getElementById('mediaBar'), h = document.getElementById('resHandle');
  bar.classList.remove('hide'); h.classList.remove('hide');
  const top = mr.top - cr.top;
  bar.style.left = (mr.left - cr.left) + 'px';
  bar.style.top = Math.max(2, top - bar.offsetHeight - 6) + 'px';
  h.style.left = (mr.right - cr.left - 9) + 'px';
  h.style.top = (mr.bottom - cr.top - 9) + 'px';
}

function setMediaWidth(w) {
  if (!selMedia) return;
  selMedia.style.width = w;
  selMedia.style.height = 'auto';
  p_html(ed().innerHTML);
  setTimeout(positionMediaUI, 30);
}

function setMediaAlign(a) {
  if (!selMedia) return;
  selMedia.style.display = 'block';
  selMedia.style.marginLeft = a === 'center' ? 'auto' : '0';
  selMedia.style.marginRight = a === 'center' ? 'auto' : 'auto';
  if (a === 'left') selMedia.style.marginRight = 'auto';
  p_html(ed().innerHTML);
  setTimeout(positionMediaUI, 30);
}

function deleteMedia() {
  if (!selMedia) return;
  const el = selMedia; deselectMedia(); el.remove();
  p_html(ed().innerHTML);
}

/* ---------- Zusatzinfo festhalten und verschieben (wie bei den Seiten-Reitern) ---------- */
function onEdPointerDown(e) {
  if (e.target.closest('.zi-x') || e.target.closest('.zi-edit')) return; // Löschen/Bearbeiten sollen nicht versehentlich Verschieben auslösen
  const summary = e.target.closest('summary');
  if (summary && summary.parentElement.classList.contains('zi')) {
    startZiHold(e, summary.parentElement);
  }
}

function startZiHold(e, det) {
  if (e.button !== undefined && e.button !== 0) return;
  const startX = e.clientX, startY = e.clientY, pid = e.pointerId;
  let active = false;

  const activate = () => {
    active = true;
    det.classList.add('zi-holding');
    try { det.setPointerCapture(pid); } catch (_) {}
  };
  const holdTimer = setTimeout(activate, 220);

  const onMove = ev => {
    if (!active) {
      if (Math.abs(ev.clientX - startX) > 10 || Math.abs(ev.clientY - startY) > 10) finish(false);
      return;
    }
    ev.preventDefault();
    const container = det.parentElement;
    const kids = [...container.children].filter(k => k !== det);
    let target = null;
    for (const kid of kids) {
      const r = kid.getBoundingClientRect();
      if (ev.clientY < r.top + r.height / 2) { target = kid; break; }
    }
    if (target) container.insertBefore(det, target);
    else container.appendChild(det);
  };
  const onUp = () => finish(active);
  function finish(wasActive) {
    clearTimeout(holdTimer);
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    document.removeEventListener('pointercancel', onUp);
    if (wasActive) {
      det.classList.remove('zi-holding');
      p_html(ed().innerHTML);
    }
  }
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
  document.addEventListener('pointercancel', onUp);
}

// Ecke ziehen, um frei zu skalieren
(function () {
  const h = document.getElementById('resHandle');
  if (!h) return;
  let start = null;
  h.addEventListener('pointerdown', e => {
    if (!selMedia) return;
    e.preventDefault();
    h.setPointerCapture(e.pointerId);
    start = { x: e.clientX, w: selMedia.getBoundingClientRect().width, max: ed().clientWidth };
  });
  h.addEventListener('pointermove', e => {
    if (!start || !selMedia) return;
    const w = Math.max(60, Math.min(start.max, start.w + (e.clientX - start.x)));
    const pct = Math.round(w / start.max * 100);
    selMedia.style.width = pct >= 98 ? '100%' : `clamp(140px, ${pct}%, 100%)`;
    selMedia.style.height = 'auto';
    positionMediaUI();
  });
  h.addEventListener('pointerup', e => {
    if (!start) return;
    start = null; h.releasePointerCapture(e.pointerId);
    p_html(ed().innerHTML);
  });
})();

document.addEventListener('click', e => {
  if (!e.target.closest('.canvas')) deselectMedia();
});
window.addEventListener('resize', () => { if (selMedia) positionMediaUI(); });
/* Merkt sich die letzte Markierung im Textfeld, damit die Einfügeleiste sie verlinken kann */
let lastRange = null;
document.addEventListener('selectionchange', () => {
  const e = ed(); if (!e) return;
  const s = window.getSelection();
  if (s && s.rangeCount && e.contains(s.anchorNode)) lastRange = s.getRangeAt(0).cloneRange();
});

function linkSelection(url) {
  const e = ed();
  if (!e || !lastRange || lastRange.collapsed) return false;
  e.focus();
  const s = window.getSelection(); s.removeAllRanges(); s.addRange(lastRange);
  document.execCommand('createLink', false, url);
  const a = e.querySelector('a[href="' + url + '"]');
  if (a) { a.target = '_blank'; a.rel = 'noopener'; }
  p_html(e.innerHTML);
  lastRange = null;
  return true;
}

/* ---------- Einfügen aus Zwischenablage (KI-Inhalte) ---------- */
const OK_TAGS = { P:1, BR:1, DIV:1, SPAN:1, B:1, STRONG:1, I:1, EM:1, U:1, S:1, H1:1, H2:1, H3:1, H4:1, H5:1, H6:1,
  UL:1, OL:1, LI:1, A:1, IMG:1, IFRAME:1, BLOCKQUOTE:1, CODE:1, PRE:1, TABLE:1, THEAD:1, TBODY:1, TR:1, TH:1, TD:1, HR:1, SUP:1, SUB:1, DETAILS:1, SUMMARY:1 };
const MAP = { H1: 'H2', H5: 'H3', H6: 'H3', PRE: 'P' };

// Grobe Sicherheitsprüfung für style-Werte: keine Skript-Ausführung über CSS möglich machen
function safeStyle(v) {
  if (!v) return '';
  if (/javascript:|expression\(|@import|<|>/i.test(v)) return '';
  return v;
}

function clean(html) {
  const d = new DOMParser().parseFromString(html, 'text/html');
  (function walk(node) {
    [...node.childNodes].forEach(c => {
      if (c.nodeType === 1) {
        let tag = c.tagName;
        if (tag === 'SCRIPT' || tag === 'META' || tag === 'LINK') return c.remove();
        if (tag === 'STYLE') return c.remove(); // <style>-Blöcke raus, style="..."-Attribute bleiben erlaubt
        if (!OK_TAGS[tag]) { while (c.firstChild) node.insertBefore(c.firstChild, c); return c.remove(); }
        if (MAP[tag]) { const r = d.createElement(MAP[tag]); while (c.firstChild) r.appendChild(c.firstChild); c.replaceWith(r); c = r; tag = r.tagName; }
        [...c.attributes].forEach(a => {
          const nm = a.name.toLowerCase();
          if (nm.startsWith('on')) return c.removeAttribute(a.name); // keine Event-Handler
          const keep = nm === 'style' || nm === 'contenteditable'
            || ((tag === 'SPAN' || tag === 'DETAILS' || tag === 'DIV') && nm === 'class')
            || (tag === 'A' && nm === 'href') || (tag === 'IMG' && (nm === 'src' || nm === 'alt'))
            || (tag === 'IFRAME' && (nm === 'src' || nm === 'allowfullscreen' || nm === 'loading'));
          if (!keep) return c.removeAttribute(a.name);
          if (nm === 'style') { const s = safeStyle(a.value); s ? c.setAttribute('style', s) : c.removeAttribute('style'); }
        });
        if (tag === 'A') { c.target = '_blank'; c.rel = 'noopener'; }
        walk(c);
      } else if (c.nodeType !== 3) c.remove();
    });
  })(d.body);
  return d.body.innerHTML;
}

const bare = t => /^https?:\/\/\S+$/.test(t);
const isYt = t => /youtu\.?be/i.test(t);
const isImg = t => /\.(jpe?g|png|gif|webp|svg|avif)(\?\S*)?$/i.test(t);
// Fertiger Einbettungscode, z. B. von PhET, GeoGebra, LearningApps, YouTube
const isEmbedCode = t => /^\s*<(iframe|img|video|embed|blockquote)\b[\s\S]*>/i.test(t.trim());

// Baut ein iFrame und übernimmt dabei das Seitenverhältnis aus width/height, falls vorhanden
function makeIframe(src, w, h) {
  const ratio = (w && h && +w > 0 && +h > 0) ? ` style="aspect-ratio:${+w}/${+h}"` : '';
  return `<iframe src="${attr(src)}"${ratio} allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
}

// Holt src, width und height aus einem eingefügten Einbettungscode
function parseEmbed(code) {
  const doc = new DOMParser().parseFromString(code, 'text/html');
  const f = doc.querySelector('iframe, embed, video');
  if (f) return { src: f.getAttribute('src'), w: f.getAttribute('width'), h: f.getAttribute('height') };
  return null;
}

// Markdown-Grundformen, falls reiner Text eingefügt wird
/* ---------- Einfache Formeln (LaTeX-ähnlich) in lesbare Zeichen umwandeln ---------- */
const GREEK_MAP = {
  Delta:'Δ', delta:'δ', alpha:'α', beta:'β', gamma:'γ', Gamma:'Γ',
  lambda:'λ', Lambda:'Λ', mu:'μ', pi:'π', Pi:'Π', theta:'θ', Theta:'Θ',
  omega:'ω', Omega:'Ω', sigma:'σ', Sigma:'Σ', rho:'ρ', phi:'φ', Phi:'Φ',
  epsilon:'ε', eta:'η', tau:'τ', nu:'ν', xi:'ξ', chi:'χ', psi:'ψ', Psi:'Ψ',
  cdot:'·', times:'×', div:'÷', pm:'±', mp:'∓',
  leq:'≤', geq:'≥', neq:'≠', approx:'≈', equiv:'≡', propto:'∝',
  infty:'∞', rightarrow:'→', to:'→', leftarrow:'←', Rightarrow:'⇒', Leftrightarrow:'⇔',
  sum:'∑', int:'∫', partial:'∂', nabla:'∇', degree:'°', circ:'°'
};

function convertMathSegment(s) {
  s = s.replace(/\\[,;!]/g, ' ');
  s = s.replace(/\\frac\{([^{}]+)\}\{([^{}]+)\}/g, '($1)/($2)');
  s = s.replace(/\\sqrt\{([^{}]+)\}/g, '√($1)');
  s = s.replace(/\\sqrt\s*([A-Za-z0-9])/g, '√$1');
  s = s.replace(/\\([A-Za-z]+)(?![A-Za-z])/g, (m, name) => GREEK_MAP[name] || m);
  s = s.replace(/\^\{([^{}]+)\}/g, (_, g) => `<sup>${g}</sup>`);
  s = s.replace(/\^([A-Za-z0-9+-])/g, (_, g) => `<sup>${g}</sup>`);
  s = s.replace(/_\{([^{}]+)\}/g, (_, g) => `<sub>${g}</sub>`);
  s = s.replace(/_([A-Za-z0-9+-])/g, (_, g) => `<sub>${g}</sub>`);
  s = s.replace(/[{}]/g, '');
  s = s.replace(/\\([a-zA-Z]+)/g, '$1');
  return s;
}

// Formeln in $...$, $$...$$, \(...\), \[...\] finden, umwandeln und vor dem Escapen sichern
function extractMath(text) {
  const store = [];
  const save = html => { store.push(html); return `\u0000${store.length - 1}\u0000`; };
  let out = text.replace(/\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]/g, (_, a, b) => save(convertMathSegment((a || b).trim())));
  out = out.replace(/\$([^$\n]+?)\$|\\\(([\s\S]+?)\\\)/g, (_, a, b) => save(convertMathSegment((a || b).trim())));
  return { text: out, store };
}

function mdToHtml(t) {
  return t.split(/\n{2,}/).map(blk => {
    const l = blk.trim();
    if (/^#{1,6}\s/.test(l)) { const lv = Math.min(l.match(/^#+/)[0].length, 3); return `<h${Math.max(lv,2)}>${esc(l.replace(/^#+\s*/, ''))}</h${Math.max(lv,2)}>`; }
    if (/^[-*]\s/m.test(l) && l.split('\n').every(x => /^[-*]\s/.test(x.trim())))
      return '<ul>' + l.split('\n').map(x => `<li>${inline(x.replace(/^\s*[-*]\s*/, ''))}</li>`).join('') + '</ul>';
    if (/^\d+[.)]\s/m.test(l) && l.split('\n').every(x => /^\d+[.)]\s/.test(x.trim())))
      return '<ol>' + l.split('\n').map(x => `<li>${inline(x.replace(/^\s*\d+[.)]\s*/, ''))}</li>`).join('') + '</ol>';
    if (/^>\s/.test(l)) return `<blockquote>${inline(l.replace(/^>\s*/gm, ''))}</blockquote>`;
    return `<p>${inline(l).replace(/\n/g, '<br>')}</p>`;
  }).join('');
}
function inline(s) {
  const { text, store } = extractMath(s);
  let out = esc(text)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|\W)\*([^*]+)\*(?=\W|$)/g, '$1<em>$2</em>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\[(.+?)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  out = out.replace(/\u0000(\d+)\u0000/g, (_, i) => store[+i]);
  return out;
}

function onPaste(e) {
  const target = e.currentTarget;
  const cd = e.clipboardData;
  // Bild aus der Zwischenablage (z. B. Bildschirmfoto)
  const items = [...(cd.items || [])];
  const imgItem = items.find(i => i.type && i.type.startsWith('image/'));
  if (imgItem) {
    e.preventDefault();
    const f = imgItem.getAsFile();
    if (f) insertImageFile(f, target);
    return;
  }
  e.preventDefault();
  const html = cd.getData('text/html');
  const txt = (cd.getData('text/plain') || '').trim();

  // Fertiger Einbettungscode als Text eingefügt (PhET, GeoGebra, LearningApps …)
  if (isEmbedCode(txt)) {
    const em = parseEmbed(txt);
    if (em && em.src) return ins(makeIframe(em.src, em.w, em.h), target);
    return ins(clean(txt), target);
  }
  if (bare(txt)) {
    // Adresse über markiertem Text -> Markierung verlinken (nur im Haupt-Editor unterstützt)
    if (target.id === 'ed') {
      const s = window.getSelection();
      if (s && s.rangeCount && !s.isCollapsed && ed().contains(s.anchorNode)) {
        lastRange = s.getRangeAt(0).cloneRange();
        if (linkSelection(txt)) return;
      }
    }
    if (isYt(txt)) return ins(`<iframe src="https://www.youtube-nocookie.com/embed/${ytId(txt)}" allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>`, target);
    if (isImg(txt)) return ins(`<img src="${attr(txt)}" style="width:100%">`, target);
    return ins(makeIframe(txt), target);
  }
  if (html && html.trim()) return ins(clean(html), target);
  if (txt) return ins(mdToHtml(txt), target);
}

/* ---------- Bilddateien: ziehen, ablegen, einfügen ---------- */
const MAX_DIM = 1600;      // längste Seite in Pixeln, auf die verkleinert wird
const MAX_IMG = 4 * 1024 * 1024; // Sicherheitsgrenze für Dateien, die sich nicht verkleinern lassen (z. B. GIF)

// Bild einlesen, automatisch verkleinern/komprimieren, Ergebnis (Data-URL) an cb übergeben
function processImageFile(file, cb) {
  if (!file.type.startsWith('image/')) return toast('Nur Bilddateien werden unterstützt.');

  if (file.type === 'image/gif') {
    if (file.size > MAX_IMG) return toast('GIF ist zu groß (über 4 MB) — bitte vorher verkleinern.');
    const r = new FileReader();
    r.onload = () => cb(r.result);
    r.onerror = () => toast('Bild konnte nicht gelesen werden.');
    r.readAsDataURL(file);
    return;
  }

  const img = new Image();
  const url = URL.createObjectURL(file);
  img.onload = () => {
    URL.revokeObjectURL(url);
    const scale = Math.min(1, MAX_DIM / Math.max(img.width, img.height));
    const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, w, h);
    const keepPng = file.type === 'image/png' && hasTransparency(ctx, w, h);
    const dataUrl = keepPng ? canvas.toDataURL('image/png') : canvas.toDataURL('image/jpeg', 0.82);
    if (dataUrl.length > MAX_IMG) return toast('Bild ist auch verkleinert noch sehr groß — bitte ein kleineres Bild verwenden.');
    cb(dataUrl);
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast('Bild konnte nicht gelesen werden.'); };
  img.src = url;
}

/* ---------- Aufklappbare Zusatzinfo (z. B. für Differenzierung E-/G-Kurs) ---------- */
let editingZi = null;

function openZiModal() {
  editingZi = null;
  document.getElementById('ziModalTitle').textContent = 'Zusatzinfo einfügen';
  document.getElementById('ziSubmitBtn').textContent = 'Einfügen';
  document.getElementById('ziTitle').value = '';
  document.getElementById('ziBody').innerHTML = '';
  document.getElementById('ziModal').classList.remove('hide');
  setTimeout(() => document.getElementById('ziTitle').focus(), 50);
}

function openZiModalEdit(det) {
  editingZi = det;
  document.getElementById('ziModalTitle').textContent = 'Zusatzinfo bearbeiten';
  document.getElementById('ziSubmitBtn').textContent = 'Speichern';
  const titleEl = det.querySelector('.zi-title');
  const bodyDiv = det.querySelector('.zi-body');
  document.getElementById('ziTitle').value = titleEl ? titleEl.textContent.trim() : '';
  document.getElementById('ziBody').innerHTML = bodyDiv ? bodyDiv.innerHTML : '';
  document.getElementById('ziModal').classList.remove('hide');
  setTimeout(() => document.getElementById('ziTitle').focus(), 50);
}

function closeZiModal() { document.getElementById('ziModal').classList.add('hide'); editingZi = null; }

function insertZusatzinfo() {
  const title = document.getElementById('ziTitle').value.trim() || 'Zusatzinfo';
  const bodyEl = document.getElementById('ziBody');
  const bodyHtml = bodyEl.innerHTML.trim();
  const isEmpty = !bodyEl.textContent.trim() && !bodyEl.querySelector('img, iframe');
  if (isEmpty) { bodyEl.focus(); return toast('Bitte einen Inhalt eingeben.'); }

  if (editingZi) {
    const det = editingZi;
    const titleEl = det.querySelector('.zi-title');
    const bodyDiv = det.querySelector('.zi-body');
    if (titleEl) titleEl.textContent = title;
    if (bodyDiv) bodyDiv.innerHTML = bodyHtml;
    editingZi = null;
    closeZiModal();
    p_html(ed().innerHTML);
    return;
  }

  closeZiModal();
  ins(`<details class="zi"><summary><span class="zi-grip" contenteditable="false">⠿</span><span class="zi-title">${esc(title)}</span><span class="zi-edit" contenteditable="false" title="Zusatzinfo bearbeiten">✎</span><span class="zi-x" contenteditable="false" title="Zusatzinfo entfernen">✕</span></summary><div class="zi-body">${bodyHtml}</div></details><p><br></p>`);

// Stichprobe auf durchsichtige Pixel, um zu entscheiden ob PNG erhalten bleiben muss
function hasTransparency(ctx, w, h) {
  const step = Math.max(1, Math.floor(Math.min(w, h) / 40));
  const data = ctx.getImageData(0, 0, w, h).data;
  for (let y = 0; y < h; y += step) {
    for (let x = 0; x < w; x += step) {
      if (data[(y * w + x) * 4 + 3] < 250) return true;
    }
  }
  return false;
}

function onDragOver(e) {
  e.preventDefault();
  const has = [...(e.dataTransfer.types || [])].includes('Files');
  if (has) e.currentTarget.classList.add('drop');
}
function onDragLeave(e) {
  if (!e.currentTarget.contains(e.relatedTarget)) e.currentTarget.classList.remove('drop');
}
function onDrop(e) {
  e.preventDefault();
  const el = e.currentTarget;
  el.classList.remove('drop');
  const files = [...(e.dataTransfer.files || [])];
  if (files.length) {
    el.focus();
    // Cursor an die Ablegestelle setzen, falls möglich
    const r = document.caretRangeFromPoint ? document.caretRangeFromPoint(e.clientX, e.clientY) : null;
    if (r) { const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); }
    files.filter(f => f.type.startsWith('image/')).forEach(f => insertImageFile(f, el));
    if (!files.some(f => f.type.startsWith('image/'))) toast('Nur Bilddateien können abgelegt werden.');
    return;
  }
  const txt = (e.dataTransfer.getData('text/plain') || '').trim();
  if (!txt) return;
  el.focus();
  if (isEmbedCode(txt)) {
    const em = parseEmbed(txt);
    if (em && em.src) return ins(makeIframe(em.src, em.w, em.h), el);
    return ins(clean(txt), el);
  }
  if (isYt(txt)) return ins(`<iframe src="https://www.youtube-nocookie.com/embed/${ytId(txt)}" allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>`, el);
  if (isImg(txt)) return ins(`<img src="${attr(txt)}">`, el);
  if (bare(txt)) return ins(`<a href="${attr(txt)}" target="_blank" rel="noopener">${esc(txt)}</a>`, el);
  ins(mdToHtml(txt), el);
}

function linkify() {
  const e = ed(); if (!e) return;
  const re = /(https?:\/\/[^\s<]+)/g;
  const wk = document.createTreeWalker(e, NodeFilter.SHOW_TEXT);
  const hits = []; let nd;
  while (nd = wk.nextNode()) { if (nd.parentElement.closest('a')) continue; re.lastIndex = 0; if (re.test(nd.textContent)) hits.push(nd); }
  hits.forEach(t => {
    re.lastIndex = 0;
    const parts = t.textContent.split(re);
    if (parts.length < 2) return;
    const f = document.createDocumentFragment();
    parts.forEach(s => {
      if (/^https?:\/\//.test(s)) { const a = document.createElement('a'); a.href = s; a.target = '_blank'; a.rel = 'noopener'; a.textContent = s; f.appendChild(a); }
      else if (s) f.appendChild(document.createTextNode(s));
    });
    t.replaceWith(f);
  });
  p_html(e.innerHTML);
}

const AI_PROMPT = `Erzeuge eine Aufgabe für eine digitale Lektion. Antworte AUSSCHLIESSLICH mit einem JSON-Objekt, ohne Erklärung, ohne Code-Block.

Wähle eines dieser Formate:

Mehrfachauswahl (mehrere richtige):
{"type":"multi","q":"Frage?","opts":["A","B","C","D"],"correct":[0,2]}

Wahr oder Falsch:
{"type":"truefalse","q":"Aussage, die beurteilt werden soll.","answer":true}

Kurzantwort (Schüler tippt ein Wort oder eine Zahl):
{"type":"text","q":"Frage?","answers":["Lösung","Alternative Schreibweise"]}

Lösungswort (Schüler hat das Wort woanders erfahren, z. B. im Video, auf einem Arbeitsblatt, im Unterrichtsgespräch — keine Frage nötig):
{"type":"password","q":"Optionaler Hinweistext, woher das Wort stammt","answers":["Lösungswort"]}

Zuordnen (Begriff zu Definition):
{"type":"dragdrop","pairs":[{"term":"Begriff","def":"Definition"},{"term":"Begriff 2","def":"Definition 2"}]}

Lückentext (Lückenwörter mit Sternchen markieren):
{"type":"gap","text":"Die *Frequenz* wird in *Hertz* gemessen."}

Reihenfolge (in der KORREKTEN Reihenfolge angeben):
{"type":"order","items":["Erster Schritt","Zweiter Schritt","Dritter Schritt"]}

Hinweise: "correct" ist der Index ab 0. Verwende deutsche Sprache und passe Niveau und Inhalt an folgendes Thema an:

THEMA: `;

function copyPrompt() {

function fallbackCopy(text, cb) {

  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';

// Prüft und normalisiert eine von der KI erzeugte Aufgabe
function parseAiTask(raw) {
  let s = raw.trim();
  s = s.replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();  // Code-Block entfernen
  const a = s.indexOf('{'), b = s.lastIndexOf('}');
  if (a === -1 || b === -1) throw new Error('Kein JSON-Objekt gefunden.');
  const o = JSON.parse(s.slice(a, b + 1));
  const t = o.task || o;
  if (!t.type) throw new Error('Feld "type" fehlt.');
  const id = uid('t');
  const str = x => String(x == null ? '' : x);

  if (t.type === 'mc') {
    if (!Array.isArray(t.opts) || t.opts.length < 2) throw new Error('"opts" braucht mindestens zwei Antworten.');
    const c = Number(t.correct);
    if (!(c >= 0 && c < t.opts.length)) throw new Error('"correct" liegt außerhalb der Antworten.');
    return { id, type: 'mc', q: str(t.q), opts: t.opts.map(str), correct: c };
  }
  if (t.type === 'multi') {
    if (!Array.isArray(t.opts) || t.opts.length < 3) throw new Error('"opts" braucht mindestens drei Antworten.');
    let c = Array.isArray(t.correct) ? t.correct.map(Number) : [Number(t.correct)];
    c = c.filter(x => x >= 0 && x < t.opts.length);
    if (!c.length) throw new Error('"correct" enthält keine gültige Antwort.');
    return { id, type: 'multi', q: str(t.q), opts: t.opts.map(str), correct: c };
  }
  if (t.type === 'truefalse') {
    if (typeof t.answer !== 'boolean') throw new Error('"answer" muss true oder false sein.');
    return { id, type: 'truefalse', q: str(t.q), answer: t.answer };
  }
  if (t.type === 'text') {
    const ans = (Array.isArray(t.answers) ? t.answers : [t.answers]).map(str).filter(x => x.trim());
    if (!ans.length) throw new Error('"answers" ist leer.');
    return { id, type: 'text', q: str(t.q), answers: ans };
  }
  if (t.type === 'password') {
    const ans = (Array.isArray(t.answers) ? t.answers : [t.answers]).map(str).filter(x => x.trim());
    if (!ans.length) throw new Error('"answers" ist leer.');
    return { id, type: 'password', q: str(t.q), answers: ans };
  }
  if (t.type === 'dragdrop') {
    if (!Array.isArray(t.pairs) || t.pairs.length < 2) throw new Error('"pairs" braucht mindestens zwei Paare.');
    return { id, type: 'dragdrop', pairs: t.pairs.map(p => ({ term: str(p.term), def: str(p.def) })) };
  }
  if (t.type === 'gap') {
    const txt = str(t.text);
    if (!/\*[^*]+\*/.test(txt)) throw new Error('Im Text fehlen mit *Sternchen* markierte Lücken.');
    return { id, type: 'gap', text: txt };
  }
  if (t.type === 'order') {
    if (!Array.isArray(t.items) || t.items.length < 2) throw new Error('"items" braucht mindestens zwei Schritte.');
    return { id, type: 'order', items: t.items.map(str) };
  }
  throw new Error('Unbekannter Aufgabentyp: ' + t.type);
}

    </div>
